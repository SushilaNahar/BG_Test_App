 Both are indestructible."]], "fc": [["samaṁ sarveṣu bhūteṣu", "Equally situated in all beings."], ["vinaśyatsv avinaśyantam", "Imperishable within the perishable."], ["parameśvaram", "The Supersoul (or, in another reading, the individual master of the body)."]], "cz": ["One who sees the {{Supersoul}} accompanying the individual soul in all bodies and who understands that neither the soul nor the Supersoul is ever {{destroyed}}, actually {{sees}}."], "ap": [["How might seeing the imperishable within the perishable change the way you respond to loss?", "Example: I grieve, but I remember the person is more than the body, and so am I."]], "ex": "Real vision sees the body, the soul and the Supersoul together, and knows that the soul and Supersoul survive the body’s destruction.", "verse": "samaṁ sarveṣu bhūteṣu\ntiṣṭhantaṁ parameśvaram\nvinaśyatsv avinaśyantaṁ\nyaḥ paśyati sa paśyati", "tr": "One who sees the Supersoul accompanying the individual soul in all bodies and who understands that neither the soul nor the Supersoul is ever destroyed, actually sees.", "trlabel": "Translation (from your PDF)", "lt": ["Equally situated in all beings", "the Supersoul, the Supreme Lord", "imperishable within the perishable", "one who sees this, truly sees"]}, {"n": 29, "nl": "13.29", "label": "Text 13.29", "title": "Not degrading oneself", "gist": "Seeing rightly, one doesn’t degrade himself by pursuing the mind’s selfish desires, and approaches the transcendental destination.", "focus": [["Purport (a)-(b): What is the mind’s role?", "Generally the mind is addicted to sense gratification. When it turns to the Supersoul, one becomes advanced."]], "fc": [["samavasthitam īśvaram", "The Lord equally situated everywhere."], ["na hinasty ātmanātmānam", "Does not degrade himself by his mind."], ["parāṁ gatim", "The transcendental destination."]], "cz": ["One who sees the Supersoul in every living being and {{equal}} everywhere does not {{degrade}} himself by his {{mind}}. Thus he approaches the transcendental {{destination}}."], "ap": [["Think of a person you dislike. What changes if you remember the Supersoul is in them too?", "Example: I would judge less harshly and treat them with more respect."]], "ex": "Seeing the Lord equally present in everyone keeps the mind from dragging me down and leads to the highest destination.", "verse": "samaṁ paśyan hi sarvatra\nsamavasthitam īśvaram\nna hinasty ātmanātmānaṁ\ntato yāti parāṁ gatim", "tr": "One who sees the Supersoul in every living being and equal everywhere does not degrade himself by his mind. Thus he approaches the transcendental destination.", "trlabel": "Translation (from your PDF)", "lt": ["Seeing equally everywhere", "the Lord, equally situated", "he does not degrade himself by his mind", "thus he goes to the supreme destination"]}, {"n": 30, "nl": "13.30", "label": "Text 13.30", "title": "The body acts, the self doesn’t", "gist": "The one who actually sees knows neither he nor others are acting; all activities are performed by the body, created by nature. The body, like a machine, is given by the Lord according to past desires and karma; the soul is outside bodily activity.", "focus": [["Practical application: Why does the text stress that the soul does nothing?", "To engender humility. It expands the knowledge of 13.21: “I, the soul, am the cause of various sufferings and enjoyments, but I do nothing; only material nature acts.”"]], "fc": [["prakṛtyaiva karmāṇi", "Actions performed by nature alone."], ["akartāram", "Non-doer."]], "cz": ["One who can see that all activities are performed by the {{body}}, which is created of {{material nature}}, and sees that the {{self}} does nothing, actually sees."], "ap": [["When you feel proud or guilty about an action, how might this verse help you step back?", "Example: I do my duty, but I don’t take total authorship, since the body, mind and circumstances all belong to nature."]], "ex": "The body is doing everything under nature’s influence. The self, the conscious being within, is not the doer.", "verse": "prakṛtyaiva ca karmāṇi\nkriyamāṇāni sarvaśaḥ\nyaḥ paśyati tathātmānam\nakartāraṁ sa paśyati", "tr": "One who can see that all activities are performed by the body, which is created of material nature, and sees that the self does nothing, actually sees.", "trlabel": "Translation (from your PDF)", "lt": ["Activities are done by material nature alone", "performed in every way", "one who sees that the self", "is a nondoer, truly sees"]}, {"n": 31, "nl": "13.31", "label": "Text 13.31", "title": "Only the body acts; Brahman vision", "gist": "The living entity is distinct from the field of activities. Ceasing to see different identities due to bodies, the sensible man attains the Brahman conception.", "focus": [["Purport (a)-(b) and practical application: What should we stop seeing, and what results?", "Stop seeing individuals as their fields of activity, since all bodies cease to exist. The soul and Supersoul have nothing to do with matter; that is Brahman vision. It leads to purified consciousness that can develop Kṛṣṇa consciousness."]], "fc": [["bhūta-pṛthag-bhāvam", "The separate identities of beings (based on bodies)."], ["brahma sampadyate", "He attains the Brahman conception."]], "cz": ["When a sensible man ceases to see different {{identities}}, which are due to different material {{bodies}}, he attains to the {{Brahman}} conception."], "ap": [["What labels (job, status, species, nationality) do you most easily attach to people, and what would seeing beyond them look like?", "Open-ended. Example: “the boss” or “the stranger”, dropped in favor of “a soul like me”."]], "ex": "The differences among beings are bodily. A wise person sees past them to the spiritual sameness of all souls.", "verse": "yadā bhūta-pṛthag-bhāvam\neka-stham anupaśyati\ntata eva ca vistāraṁ\nbrahma sampadyate tadā", "tr": "When a sensible man ceases to see different identities, which are due to different material bodies, he attains to the Brahman conception. Thus he sees that beings are expanded everywhere.", "trlabel": "Translation (from your PDF)", "lt": ["When a sensible man ceases to see separate identities of beings", "as situated in one (material nature)", "and sees their expansion from that one", "then he attains the Brahman conception"]}, {"n": 32, "nl": "13.32", "label": "Text 13.32", "title": "The vision of eternity", "gist": "Vision of eternity: the imperishable soul is transcendental, eternal and beyond the modes. Despite contact with the body he does nothing and isn’t entangled. Two analogies follow in 13.33–13.34.", "focus": [["Link to 13.33: What question does 13.32 raise, and how is it answered?", "If the soul is within the body, does he combine with it? Krishna answers that matter and spirit do not mix, with two analogies (sky in 13.33, sun in 13.34)."]], "fc": [["anāditvāt", "Because of being beginningless."], ["nirguṇatvāt", "Because of being beyond the modes."], ["na karoti na lipyate", "Neither acts nor is entangled."]], "cz": ["Those with the vision of eternity can see that the soul is {{transcendental}}, eternal, and beyond the {{modes}} of nature. Despite contact with the material body, O Arjuna, the soul neither {{does}} anything nor is {{entangled}}."], "ap": [["How might remembering “not entangled” help you when you feel stuck in a role or a situation?", "Example: I still fulfill the role, but my real identity is not defined by it."]], "ex": "The soul is eternal and beyond the modes. Even while in a body, it isn’t the doer and isn’t bound by what the body does.", "verse": "anāditvān nirguṇatvāt\nparamātmāyam avyayaḥ\nśarīra-stho ’pi kaunteya\nna karoti na lipyate", "tr": "Those with the vision of eternity can see that the soul is transcendental, eternal, and beyond the modes of nature. Despite contact with the material body, O Arjuna, the soul neither does anything nor is entangled.", "trlabel": "Translation (from your PDF)", "lt": ["Because of being beginningless and beyond the modes", "this imperishable soul is transcendental", "although situated in the body, O son of Kuntī", "he neither does anything nor is entangled"]}, {"n": 33, "nl": "13.33", "label": "Text 13.33", "title": "First analogy: the sky", "gist": "Like the sky, which is all-pervading but doesn’t mix with anything due to subtlety, the soul in Brahman vision doesn’t mix with the body.", "focus": [["Purport: What further example is given, and what can’t science ascertain?", "Air enters mud, stool and water but doesn’t mix with anything. Scientists cannot ascertain how the soul is in contact with the body or how he leaves it."]], "fc": [["ākāśa", "Space, sky."], ["saukṣmya", "Subtlety."], ["nopalipyate", "Is not contaminated."]], "cz": ["The sky, due to its {{subtle}} nature, does not {{mix}} with anything, although it is {{all-pervading}}. Similarly, the {{soul}}, situated in Brahman vision, does not mix with the body."], "ap": [["When you are in a difficult environment, how can the sky analogy help you keep your inner center?", "Example: I stay present in the environment without letting it define or contaminate me."]], "ex": "Like the sky that touches everything without being stained, the soul is in the body but never mixes with it.", "verse": "yathā sarva-gataṁ saukṣmyād\nākāśaṁ nopalipyate\nsarvatrāvasthito dehe\ntathātmā nopalipyate", "tr": "The sky, due to its subtle nature, does not mix with anything, although it is all-pervading. Similarly, the soul, situated in Brahman vision, does not mix with the body, though situated in that body.", "trlabel": "Translation (from your PDF)", "lt": ["As the all-pervading sky, due to its subtlety", "does not mix with anything", "situated everywhere in the body", "so the soul does not mix (with the body)"], "link": {"prev": "13.32", "t": "13.32 says the soul in the body neither acts nor is entangled. If the soul is within the body, does he combine with it? Krishna answers with two analogies: the sky (13.33) and the sun (13.34).", "src": "notes"}}, {"n": 34, "nl": "13.34", "label": "Text 13.34", "title": "Second analogy: the sun", "gist": "As the sun illuminates the entire universe, the living entity illuminates the entire body by consciousness.", "focus": [["Purport (a): What is consciousness proof of, and why isn’t it a product of matter?", "It is proof of the soul, as sunshine is proof of the sun. When the soul leaves, consciousness is gone; so it isn’t a production of the combination of matter."], ["Purport (b): How does individual consciousness differ from supreme consciousness?", "The living entity is conscious of only one body, though qualitatively one with the Supreme. The Supersoul is conscious of all bodies."]], "fc": [["prakāśayati", "Illuminates."], ["kṛtsnam", "Entire."]], "cz": ["As the {{sun}} alone illuminates all this {{universe}}, so does the {{living entity}}, one within the body, illuminate the entire body by {{consciousness}}."], "ap": [["What everyday event shows that consciousness depends on something other than the body’s materials?", "The difference between a living body and a dead one: the same material remains, but consciousness is gone once the soul has left."]], "ex": "The soul, located in one place in the body, spreads consciousness everywhere in the body just as the sun spreads light. Consciousness shows the soul is there.", "verse": "yathā prakāśayaty ekaḥ\nkṛtsnaṁ lokam imaṁ raviḥ\nkṣetraṁ kṣetrī tathā kṛtsnaṁ\nprakāśayati bhārata", "tr": "O son of Bharata, as the sun alone illuminates all this universe, so does the living entity, one within the body, illuminate the entire body by consciousness.", "trlabel": "Translation (from your PDF)", "lt": ["As the one sun illuminates", "all this universe", "so the owner of the field (the soul) illuminates the whole field", "with consciousness, O son of Bharata"]}, {"n": 35, "nl": "13.35", "label": "Text 13.35", "title": "One-verse chapter summary", "gist": "Seeing with the eyes of knowledge the difference between the body and the knower of the body, and the process of liberation from bondage, one attains the Supreme goal.", "focus": [["Purport (a)-(b): What is the purport of the chapter, and how does the process work?", "Know the distinction between the body, owner and Supersoul, and the process of liberation (13.8–13.12), then go to the Supreme destination. A faithful person needs good association, hears, accepts a spiritual master, learns to distinguish matter and spirit, analyzes the body into twenty-four elements, then analyzes soul and Supersoul as separate."], ["Purport (c): What is the conclusion?", "These things are for contemplation and realization. Understand the chapter fully with the help of the spiritual master."]], "fc": [["jñāna-cakṣuṣā", "With the eye of knowledge."], ["bhūta-prakṛti-mokṣam", "Liberation from bondage to material nature."]], "cz": ["One who {{knowingly}} sees this {{difference}} between the body and the owner of the body and can understand the process of {{liberation}} from this bondage, also attains to the supreme goal."], "ap": [["After working through Chapter 13, what one change do you want to make in how you treat your body, your mind or others?", "Open-ended. Example: remember I’m the knower of my body, so I can observe cravings without obeying every one."]], "ex": "The chapter ends by saying: know the body, the soul and the Supersoul as different, and know the way out of bondage. That knowledge leads to the highest goal.", "verse": "kṣetra-kṣetrajñayor evam\nantaraṁ jñāna-cakṣuṣā\nbhūta-prakṛti-mokṣaṁ ca\nye vidur yānti te param", "tr": "One who knowingly sees this difference between the body and the owner of the body and can understand the process of liberation from this bondage, also attains to the supreme goal.", "trlabel": "Translation (from your PDF)", "lt": ["Thus, between the field and the knower of the field", "the difference, with the eyes of knowledge", "and the liberation from material nature", "those who know this go to the Supreme"]}], "why": ["Krishna describes the vision of knowledge (jñāna-cakṣu): one who sees the difference between the body, its owner and the Supersoul, and knows the process of liberation, attains the Supreme goal.", "notes"], "from": {"prev": "Section 4", "t": "Having described prakṛti, puruṣa, kṣetra, kṣetrajña, jñāna and jñeya, the Lord now describes the vision of one who understands them in their proper perspective.", "src": "notes"}, "one": "The vision of knowledge: the soul does not act, and the Supreme goal is reached.", "nxt": null}], "sk": "Kṣetra-kṣetrajña-vibhāga-yoga", "verses": 35, "lead": "From Chapter 12: Krishna promised to free His devotees from birth and death, so now the knowledge needed for that is given."}, {"num": "14", "sk": "Guṇa-traya-vibhāga-yoga", "verses": 27, "name": "The Three Modes of Material Nature", "prefix": "x14", "deep": ["x14S2:4", "x14S2:5"], "chapterQ": [["What is the connection between Chapter 13 and Chapter 14?", "Chapter 13 explained how the living entity (puruṣa) is entangled in the external energy (prakṛti) due to his desire for enjoyment. Chapter 14 explains how material energy binds the soul through the three modes (Bg. 13.22), expanding the knowledge of 13.22. The key verse connecting them is Bg. 13.22."], ["Name the five sections of Chapter 14 with their verse ranges.", "I (14.1–14.4) liberation and conditioning of living entities. II (14.5–14.9) the modes bind the pure soul. III (14.10–14.13) recognizing a mode’s supremacy. IV (14.14–14.18) acting and dying within the modes. V (14.19–14.27) transcending the modes."], ["What are the two points one must know to transcend the modes?", "Everything in this world takes place under the modes, and Krishna’s activities are transcendental to the modes."], ["What binds by each mode (one line each)?", "Goodness: happiness. Passion: fruitive activities. Ignorance: madness."]], "sections": [{"id": "x14S1", "num": 1, "range": "14.1 – 14.4", "title": "The liberation and conditioning of living entities", "gist": "Krishna glorifies the knowledge He will now speak. By Him, the Supreme Lord, the material energy is impregnated with the living entities.", "app": "Understanding the conditioning of the three modes is a powerful tool on the path of self-realization.", "q": [["What is the common theme of 14.1–14.2, and of 14.3–14.4?", "14.1–14.2: introduction and glorification of Chapter 14 (understanding it gives liberation and a nature like Krishna’s; the sages attained perfection by it). 14.3–14.4: how the soul comes into the material world and is placed within the modes: material nature is the mother, and the Lord is the seed-giving father."], ["What is the link between 14.2 and 14.3?", "After glorifying the knowledge He is about to reveal, Krishna begins to explain the relationship between material nature, the conditioned living entities and Himself."], ["Practical application of Section I?", "Understanding the conditioning of the three modes is a powerful tool on the path of self-realization."]], "fl": [], "texts": [{"n": 1, "nl": "14.1", "label": "Text 14.1", "title": "Glorifying the knowledge of this chapter", "gist": "Krishna introduces the knowledge of this chapter as the supreme wisdom, the best of all knowledge, by knowing which all the sages attained supreme perfection. (14.1–14.2 share the theme: introduction and glorification of Chapter 14.)", "focus": [["Purport (a)-(c): What was revealed in Chapters 7–12, and what is the result of learning this chapter?", "Chapters 7–12 revealed the Absolute Truth as the Supreme Personality of Godhead in detail. Learning this chapter, understood through philosophical speculation, brings freedom from material entanglement and an understanding of devotional service."], ["Purport (d): Why is this knowledge proclaimed superior to all?", "Understanding the conditioning of the three modes is a powerful tool for self-realization. By it many sages attained perfection and went to the spiritual world; one can attain a transcendental nature like Krishna and liberation; whoever understands this chapter will attain perfection."]], "fc": [["jñānānāṁ jñānam uttamam", "The best of all knowledge."], ["siddhim (parāṁ siddhim)", "Perfection; the supreme perfection attained by the sages."]], "cz": ["Again I shall declare to you this supreme {{wisdom}}, the {{best}} of all knowledge, knowing which all the {{sages}} have attained to supreme {{perfection}}."], "ap": [["Why might knowing the three modes be a practical tool for you and not just theory?", "Open-ended. Example: the modes explain my moods, choices and habits, so noticing them helps me choose goodness and move toward transcendence."]], "ex": "Krishna says the knowledge He is about to give is the best of all, and it has brought the sages to perfection. It is the understanding of how the three modes work.", "verse": "śrī-bhagavān uvāca\nparaṁ bhūyaḥ pravakṣyāmi\njñānānāṁ jñānam uttamam\nyaj jñātvā munayaḥ sarve\nparāṁ siddhim ito gatāḥ", "tr": "The Blessed Lord said: Again I shall declare to you this supreme wisdom, the best of all knowledge, knowing which all the sages have attained to supreme perfection.", "trlabel": "Translation (from your PDF)", "lt": ["The Blessed Lord said", "I shall declare again the supreme", "wisdom, the best of all knowledge", "knowing which all the sages", "have attained supreme perfection"], "mem": "Superior knowledge of the modes, so the sages reached perfection", "pp": ["Chapters 7 to 12 revealed the Absolute Truth, the [[Supreme Personality of Godhead]], in detail.", "Chapter 13 showed that humbly developing knowledge can free one, and that entanglement comes from [[association with the modes]].", "Chapter 14 explains the modes: [[what they are, how they act, how they bind, how they give liberation]].", "This knowledge is proclaimed [[superior]] to the knowledge given so far.", "By it many sages attained [[perfection]] and went to the spiritual world.", "Understood through philosophical study, it leads to [[devotional service]]."], "appt": [], "vone": "Krishna announces the supreme knowledge, by which all the sages reached perfection."}, {"n": 2, "nl": "14.2", "label": "Text 14.2", "title": "Result: a nature like Krishna’s", "gist": "By becoming fixed in this knowledge, one attains a transcendental nature like Krishna’s own, and is neither born at creation nor disturbed at dissolution.", "focus": [["Purport (e): What does “attaining a transcendental nature like My own” imply?", "Qualitative equality with the Supreme Personality of Godhead, freedom from birth and death, and no loss of one’s identity as an individual soul. Liberated souls in the transcendental planets always look to the Lord’s lotus feet, engaged in His loving service."], ["Purport (f): How is transcendental knowledge defined, and what wrong idea of liberation arises without it?", "Knowledge uncontaminated by the three modes, knowing oneself on the same platform in quality as the Supreme Person. Without it people think liberation means becoming formless, without variegatedness. Actually the spiritual world has form, spiritual activity (devotional life) and an uncontaminated atmosphere."], ["Purport (f): What is the qualification and benefit?", "Qualification: develop all spiritual qualities. Benefit: one is not affected by the creation and destruction of the material world."]], "fc": [["mama sādharmyam", "Likeness in nature to Krishna; qualitative equality."], ["sarge ’pi nopajāyante pralaye na vyathanti ca", "Not born at creation, not disturbed at dissolution."]], "cz": ["By becoming fixed in this knowledge, one can attain to the {{transcendental nature}}, which is like {{My own}} nature. Thus established, one is not {{born}} at the time of creation nor {{disturbed}} at the time of dissolution."], "ap": [["How does “individual identity is not lost” change how you picture liberation?", "Liberation is not dissolving into formlessness. The soul keeps his identity and serves the Lord eternally."]], "ex": "Fixing oneself in this knowledge gives a nature like Krishna’s, so one is beyond birth and death, yet stays an individual servant of the Lord.", "verse": "idaṁ jñānam upāśritya\nmama sādharmyam āgatāḥ\nsarge ’pi nopajāyante\npralaye na vyathanti ca", "tr": "By becoming fixed in this knowledge, one can attain to the transcendental nature, which is like My own nature. Thus established, one is not born at the time of creation nor disturbed at the time of dissolution.", "trlabel": "Translation (from your PDF)", "lt": ["Taking shelter of this knowledge", "they attain a nature like My own", "not born even at the time of creation", "nor disturbed at the time of dissolution"], "mem": "Same quality as the Lord, still a servant, not formless", "pp": ["Perfect transcendental knowledge gives [[qualitative equality]] with the Supreme and freedom from [[birth and death]].", "One does not lose [[individual identity]]: liberated souls always look to the Lord's [[lotus feet]] in loving service.", "Transcendental knowledge is knowledge [[not contaminated by the three modes]].", "Wrong idea: liberation means becoming [[formless]], without variety.", "Truth: the spiritual sky has [[variegatedness]]: a spiritual form, spiritual activities ([[devotional life]]) and an uncontaminated atmosphere.", "To obtain this knowledge, develop [[all spiritual qualities]].", "Result: one is not affected by the [[creation or destruction]] of the material world."], "appt": [], "vone": "Fixed in it, one gets a nature like Krishna's, free from birth and death."}, {"n": 3, "nl": "14.3", "label": "Text 14.3", "title": "Material nature is the mother", "gist": "The total material substance, Brahman (mahad-brahma), is the source of birth. Krishna impregnates it with living entities by His glance, and the world is a combination of field and knower.", "focus": [["Purport (a)-(b): What is the source of birth, and what does the scorpion analogy refute?", "The total material substance called Brahman is the source of birth, and the Lord impregnates it with living entities. A scorpion lays eggs in rice, but the rice is not the cause of the scorpion. This refutes the idea that material nature causes the birth of living entities; the actual seed is given by the Lord."], ["Purport (c): What explanation of the world does 14.3 give?", "Everything that takes place is due to the combination of kṣetra (body) and kṣetrajña (spirit soul), and this combination is made possible by the Supreme Lord."], ["Purport (d)-(e): What are mahat-tattva and mahad-brahma?", "Mahat-tattva is the total cause of the total cosmic manifestation; the total material substance with the three modes is sometimes called Brahman (Muṇḍaka Upaniṣad). Mahad-brahma is material nature, made of 24 elements, the inferior energy; the living entity is the superior energy."]], "fc": [["mahad brahma", "The total material substance; great Brahman, i.e. material nature."], ["garbhaṁ dadhāmi", "I impregnate."]], "cz": ["The total material substance, called {{Brahman}}, is the source of {{birth}}, and it is that Brahman that I {{impregnate}}, making possible the births of all {{living beings}}, O son of Bharata."], "ap": [["Why does it matter that the Lord, not matter, provides the seed?", "Life is not a product of matter. Example: my identity is not reducible to the body, so its changes need not define me."]], "ex": "Material nature is like a mother who supplies the body, but the Lord gives the seed by impregnating nature with living entities. Life does not come from matter alone.", "verse": "mama yonir mahad brahma\ntasmin garbhaṁ dadhāmy aham\nsambhavaḥ sarva-bhūtānāṁ\ntato bhavati bhārata", "tr": "The total material substance, called Brahman, is the source of birth, and it is that Brahman that I impregnate, making possible the births of all living beings, O son of Bharata.", "trlabel": "Translation (from your PDF)", "lt": ["The total material substance, Brahman, is My womb", "in it I place the seed (impregnate)", "the birth of all living beings", "then takes place from that, O Bharata"], "mem": "Nature is the mother, the Lord gives the seed", "pp": ["Material nature is the [[mother]], supplying the living entity with a body.", "The total material substance, called [[Brahman]], is the source of birth, and the Lord [[impregnates]] it with living entities.", "Analogy: a [[scorpion lays its eggs in rice]], but the rice is not the cause of the scorpion.", "This refutes that [[material nature]] causes the birth of living entities. The actual seed is given by the [[Lord]].", "Everything that takes place is a combination of [[kṣetra (body) and kṣetrajña (soul)]], made possible by the Lord.", "[[Mahat-tattva]] is the total cause of the cosmic manifestation. Mahad-brahma is material nature, made of [[24 elements]] (inferior energy); the living entity is the [[superior energy]]."], "appt": [], "link": {"prev": "14.2", "t": "After glorifying the knowledge He is about to reveal, Krishna begins to explain the relationship between material nature, the conditioned living entities and Himself.", "src": "notes"}, "vone": "Material nature is the womb; Krishna places the living beings in it."}, {"n": 4, "nl": "14.4", "label": "Text 14.4", "title": "Krishna is the seed-giving father", "gist": "All species in all planets are born from material nature, the mother, and Krishna is the seed-giving father.", "focus": [["Purport (f): Where are living entities found?", "Everywhere, on all planets: on earth even within water and fire, and on the highest planet, where Brahmā is situated."]], "fc": [["bīja-pradaḥ pitā", "The seed-giving father."], ["sarva-yoniṣu", "In all species of life."]], "cz": ["It should be understood that all {{species}} of life, O son of Kuntī, are made possible by birth in this material nature, and that I am the {{seed-giving father}}."], "ap": [["What does it mean for your view of other species that the same Lord is the father of all?", "Open-ended. Example: I treat other creatures with more respect, seeing them as souls too."]], "ex": "Every kind of living being is born in material nature, the mother, and Krishna is the seed-giving father of all.", "verse": "sarva-yoniṣu kaunteya\nmūrtayaḥ sambhavanti yāḥ\ntāsāṁ brahma mahad yonir\nahaṁ bīja-pradaḥ pitā", "tr": "It should be understood that all species of life, O son of Kuntī, are made possible by birth in this material nature, and that I am the seed-giving father.", "trlabel": "Translation (from your PDF)", "lt": ["In all species of life, O son of Kuntī", "whatever forms are produced", "for them the great Brahman (material nature) is the womb", "and I am the seed-giving father"], "mem": "Living entities are everywhere; Krishna is the father", "pp": ["Living entities are seen [[everywhere]], on all the planets.", "On earth, even within [[water and fire]].", "Even on the highest planet, where [[Brahmā]] is situated.", "Krishna is the [[seed-giving father]] of all."], "appt": [], "vone": "All species are born there, and Krishna is the seed-giving father."}], "why": ["Krishna first glorifies the knowledge He is about to speak. Then He explains the relationship between material nature, the conditioned living entities and Himself.", "notes"], "from": {"prev": "Chapter 13", "t": "Chapter 13 explained how the living entity (puruṣa) is entangled in material nature (prakṛti) through his desire to enjoy. Chapter 14 now explains how material nature binds the soul through the three modes, expanding the knowledge of Bg. 13.22, the key verse that connects the two chapters.", "src": "notes"}, "one": "Krishna glorifies this knowledge; nature is the mother and He is the seed-giving father.", "nxt": "The souls are placed in nature, so how do the modes bind them?"}, {"id": "x14S2", "num": 2, "range": "14.5 – 14.9", "title": "The modes bind the pure soul", "gist": "The eternal living entity connects with material energy through conditioning by the three modes. One is conditioned by goodness to happiness, by passion to fruitive activities, and by ignorance to madness.", "app": "The three modes bind conditioned souls to matter by habituating them to various experiences and emotions.", "q": [["What is the link between Section I and Section II?", "Krishna now describes the soul’s entanglement. He first identifies Himself as the source, the ultimate father, of all living entities; then the placement of the souls under the control of material nature is described."], ["What is the link between 14.5 and 14.6–14.8, and what are the three conditioned types?", "14.6, 14.7 and 14.8, one after another, explain how goodness, passion and ignorance force a soul to experience his existence. The three types are the happy (goodness), the active (passion) and the helpless (ignorance)."], ["Who is at fault for the soul’s conditioning?", "The soul’s own independent desire. We cannot blame Krishna any more than a criminal can blame a judge for his sentence."], ["What does 14.9 summarize?", "14.6–14.8: goodness conditions to happiness, passion to fruits of action, ignorance to madness."], ["Summarized theme 14A: for each mode give binding force, characteristics, destination at death, and results of action.", "1. Goodness: binds by happiness, satisfaction, knowledge, superiority; illuminates the gates of the body with knowledge and frees from sinful reactions; goes to pure higher planets (Brahmaloka, Janaloka); result: purity and knowledge.\n2. Passion: binds by attachment to fruitive activities and the ropes of desire; intense unlimited desires and longings, great attachment; goes to earthly planets; result: misery, greed.\n3. Ignorance: binds by madness, indolence, sleep; delusion, darkness, inertia; birth in lower species; result: foolishness, madness, illusion, life in hellish worlds."], ["Summarized theme 14B: how does each mode obstruct spiritual life?", "1. Goodness: too happy and satisfied to do what Krishna says; sense of superiority makes humility hard; “I already know” makes learning hard.\n2. Passion: can’t give up the fruits because of unlimited desires, becomes very attached, often willing to sin, so can’t take up bhakti with determination.\n3. Ignorance: too deluded to recognize Krishna’s instructions and too lazy to perform austerities."]], "fl": [["Goodness: how it binds and where it leads", "Binds by happiness, satisfaction, knowledge and superiority. Leads to the pure higher planets like Brahmaloka or Janaloka."], ["Passion: how it binds and where it leads", "Binds by the ropes of desire and attachment to fruitive activities. Leads to the earthly planets."], ["Ignorance: how it binds and where it leads", "Binds by madness, indolence and sleep. Leads to birth in lower species or hellish worlds."], ["Three types of conditioned entities (14.6–14.8)", "Happy (goodness), active (passion), helpless (ignorance)."], ["Representative type and examples of goodness", "Brahmana; scientist, philosopher and poet."]], "texts": [{"n": 5, "nl": "14.5", "label": "Text 14.5", "title": "The living entity gets conditioned", "gist": "Material nature consists of goodness, passion and ignorance. The eternal living entity, on contact with nature, becomes conditioned by these modes, and the fault lies in his own independent desire.", "focus": [["Purport (a): Why does the transcendental living entity suffer?", "Though transcendental, he has become conditioned by the material world and is under the spell of the modes. Different bodies and activities under the different modes are the cause of the varieties of happiness and distress."], ["Notes: Who is to blame for the soul’s conditioned state?", "The soul’s own independent desire. We cannot blame Krishna any more than a criminal can blame a judge for his sentence."]], "fc": [["sattvaṁ rajas tama", "Goodness, passion, ignorance."], ["dehinam avyayam", "The imperishable embodied soul."]], "cz": ["Material nature consists of the three modes: {{goodness}}, {{passion}} and {{ignorance}}. When the living entity comes in contact with nature, he becomes {{conditioned}} by these modes."], "ap": [["Where in your own life do you blame circumstances for something your own desire caused?", "Open-ended."]], "ex": "The soul is eternal and transcendental but, by contact with nature, comes under the three modes. His own desire to enjoy independently is the cause, not Krishna.", "verse": "sattvaṁ rajas tama iti\nguṇāḥ prakṛti-sambhavāḥ\nnibadhnanti mahā-bāho\ndehe dehinam avyayam", "tr": "Material nature consists of the three modes—goodness, passion and ignorance. When the living entity comes in contact with nature, he becomes conditioned by these modes.", "trlabel": "Translation (from your PDF)", "lt": ["Goodness, passion, ignorance", "the modes born of material nature", "bind, O mighty-armed one", "the imperishable embodied soul in the body"], "mem": "The soul is transcendental but conditioned by his own desire", "pp": ["The living entity is [[transcendental]] but has become [[conditioned]] by the material world.", "Thus he is under the spell of the [[modes]].", "Different bodies and activities under the modes are the cause of varieties of [[happiness and distress]].", "The fault is his own [[independent desire]]. We cannot blame Krishna, just as a criminal cannot blame the judge."], "appt": [], "vone": "The three modes, born of nature, bind the soul."}, {"n": 6, "nl": "14.6", "label": "Text 14.6", "title": "Goodness binds by happiness and knowledge", "gist": "Goodness is pure, illuminating and frees one from sinful reactions, yet it binds one by attachment to happiness and to knowledge. (14.6–14.8 describe how each mode binds; the three types are happy, active and helpless.)", "focus": [["Purport (a)-(c): What examples and representative type does goodness have, and how does it bind?", "The brahmana is the representative type; the best examples are scientists, philosophers and poets. They feel proud of their knowledge and a sense of advanced happiness because they are more or less free from sinful reactions. That sense of happiness binds them to repeated birth and death, with no likelihood of liberation."]], "fc": [["nirmalatvāt prakāśakam anāmayam", "Purer, illuminating, free from sinful reactions."], ["sukha-saṅga / jñāna-saṅga", "Attachment to happiness / to knowledge."]], "cz": ["... the mode of goodness, being {{purer}} than the others, is {{illuminating}}, and it frees one from all {{sinful reactions}}. Those situated in that mode develop knowledge, but they become conditioned by the concept of happiness."], "ap": [["How can goodness become an obstacle to bhakti? (Notes 14B)", "Too happy and satisfied to do what Krishna says; sense of superiority makes it hard to be humble; “I already know” makes it hard to learn."]], "ex": "Goodness illuminates and purifies, but it still binds, because one becomes attached to happiness and to being knowledgeable.", "verse": "tatra sattvaṁ nirmalatvāt\nprakāśakam anāmayam\nsukha-saṁgena badhnāti\njñāna-saṁgena cānagha", "tr": "O sinless one, the mode of goodness, being purer than the others, is illuminating, and it frees one from all sinful reactions. Those situated in that mode develop knowledge, but they become conditioned by the concept of happiness.", "trlabel": "Translation (from your PDF)", "lt": ["Of these, goodness, being purer", "is illuminating and frees from sinful reactions", "it binds by attachment to happiness", "and by attachment to knowledge, O sinless one"], "mem": "Goodness: proud of knowledge and happiness", "pp": ["Three types of conditioned entities: the [[happy]] (goodness), the [[active]] (passion) and the [[helpless]] (ignorance).", "The representative type of goodness is the [[brāhmaṇa]].", "The best examples: [[scientist, philosopher and poet]].", "They are proud of their knowledge, and a sense of [[advanced happiness]] binds them to repeated birth and death.", "The happiness arises because one is more or less free from [[sinful reactions]].", "Destiny: [[no likelihood of liberation]]."], "appt": [], "link": {"prev": "14.5", "t": "After saying the soul becomes conditioned by the modes, Krishna describes the effects of each mode on the conditioned soul, in 14.6, 14.7 and 14.8, one after another.", "src": "notes"}, "vone": "Goodness binds by happiness and knowledge."}, {"n": 7, "nl": "14.7", "label": "Text 14.7", "title": "Passion binds by desire and attachment", "gist": "Passion is born of unlimited desires and longings and binds one by attachment to fruitive activities.", "focus": [["Purport (d): What does passion bind by, and what are some of its products?", "The ropes of desire and attachment. Characteristic type: attraction between man and woman. Products: hankering for sense gratification, wanting honor in society and nation, a happy family with wife, house and children, and working hard on a palatial house as if it were eternal (14.12). Thus one is bound by the fruits of work, with no chance of liberation."], ["Notes: What did “advanced civilization” once mean and now mean?", "Formerly the advanced condition was considered to be in the mode of goodness; the advancement of modern civilization is considered to be in the mode of passion."]], "fc": [["rajo rāgātmakam", "Passion is characterized by attraction/desire."], ["tṛṣṇā-saṅga", "Attachment born of longing."], ["karma-saṅga", "Attachment to fruitive activity."]], "cz": ["The mode of passion is born of {{unlimited desires}} and longings, O son of Kuntī, and because of this one is bound to material {{fruitive activities}}."], "ap": [["How does passion block bhakti? (Notes 14B)", "Can’t give up the fruits because of unlimited desires; becomes very attached, often willing to sin, so cannot take up bhakti with determination."]], "ex": "Passion comes from endless desire, and it ties a person to working for results.", "verse": "rajo rāgātmakaṁ viddhi\ntṛṣṇā-saṁga-samudbhavam\ntan nibadhnāti kaunteya\nkarma-saṁgena dehinam", "tr": "The mode of passion is born of unlimited desires and longings, O son of Kuntī, and because of this one is bound to material fruitive activities.", "trlabel": "Translation (from your PDF)", "lt": ["Know passion to be born of desire", "arising from longing and attachment", "it binds, O son of Kuntī", "the embodied soul by attachment to fruitive activity"], "mem": "Passion: bound by the ropes of desire and attachment", "pp": ["Passion binds by the ropes of [[desire]] and [[attachment]].", "Characteristic type: [[attraction between man and woman]].", "The advancement of modern civilization is considered [[passion]]; formerly the advanced condition was considered [[goodness]].", "Products of passion: hankering for [[sense gratification]], wanting [[honor]] in society and nation, a happy [[family]] with wife, house and children.", "One works hard for a [[palatial house]] as if it were eternal (14.12).", "Thus one is bound by the [[fruits of work]]. Destiny: no chance of liberation."], "appt": [], "vone": "Passion binds by desire and attachment to results."}, {"n": 8, "nl": "14.8", "label": "Text 14.8", "title": "Ignorance binds by madness, laziness and sleep", "gist": "Ignorance is born of ignorance and deludes all embodied beings. It binds by madness, indolence and sleep.", "focus": [["Purport (e): What does “tu” (but) imply, and what is the destiny of ignorance?", "This mode is a very particular quality of the embodied soul, just the opposite of goodness. Its destiny is no advancement but degradation."], ["Purport (e): How does ignorance manifest?", "Madness: everyone is dying but people madly accumulate money and neglect the eternal spirit. Laziness: no interest when invited to spiritual association. Sleep: six hours is enough, but in ignorance one sleeps 10–12 hours, is always dejected and addicted to intoxicants and sleep."]], "fc": [["pramāda", "Madness."], ["ālasya", "Indolence, laziness."], ["nidrā", "Sleep."]], "cz": ["... the mode of ignorance causes the {{delusion}} of all living entities. The result of this mode is {{madness}}, {{indolence}} and {{sleep}}, which bind the conditioned soul."], "ap": [["Which of madness, laziness or oversleeping do you notice most in yourself?", "Open-ended."]], "ex": "Ignorance covers real understanding. It binds by making one mad about material things, lazy about spiritual life, and prone to too much sleep.", "verse": "tamas tv ajñāna-jaṁ viddhi\nmohanaṁ sarva-dehinām\npramādālasya-nidrābhis\ntan nibadhnāti bhārata", "tr": "O son of Bharata, the mode of ignorance causes the delusion of all living entities. The result of this mode is madness, indolence and sleep, which bind the conditioned soul.", "trlabel": "Translation (from your PDF)", "lt": ["But know ignorance to be born of ignorance", "the deluder of all embodied beings", "by madness, indolence and sleep", "it binds, O son of Bharata"], "mem": "Ignorance: madness, laziness and too much sleep", "pp": ["\"[[Tu]]\" (but): this mode is a particular quality of the embodied soul, just the [[opposite]] of goodness.", "Destiny: no advancement, but [[degradation]].", "Under ignorance one cannot [[understand a thing as it is]].", "[[Madness]]: everyone is dying, yet people madly accumulate money and neglect the eternal spirit.", "[[Lazy]]: no interest when invited to spiritual association.", "[[Sleep]]: six hours is sufficient, but in ignorance one sleeps 10 to 12 hours, always dejected and addicted to intoxicants."], "appt": [], "vone": "Ignorance binds by madness, laziness and sleep."}, {"n": 9, "nl": "14.9", "label": "Text 14.9", "title": "Summary of how the modes bind", "gist": "Goodness conditions one to happiness, passion to the fruits of action, and ignorance to madness. This verse summarizes 14.6–14.8.", "focus": [["Purport (a): How do passion and ignorance differ, though both work hard?", "In passion one engages in fruitive action and owns as much as he can, sometimes spending for good causes such as hospitals and charities. In ignorance actions are good neither for him nor for others; one acts whimsically without following regulative principles."]], "fc": [["sattvaṁ sukhe sañjayati", "Goodness conditions one to happiness."], ["rajaḥ karmaṇi", "Passion to action."], ["tamaḥ pramāde", "Ignorance to madness."]], "cz": ["The mode of goodness conditions one to {{happiness}}, passion conditions him to the {{fruits of action}}, and ignorance to {{madness}}."], "ap": [["Write one sentence each: what does each mode hold you to today?", "Open-ended."]], "ex": "In brief: goodness holds you to happiness, passion to the results of action, ignorance to madness.", "verse": "sattvaṁ sukhe sañjayati\nrajaḥ karmaṇi bhārata\njñānam āvṛtya tu tamaḥ\npramāde sañjayaty uta", "tr": "The mode of goodness conditions one to happiness, passion conditions him to the fruits of action, and ignorance to madness.", "trlabel": "Translation (from your PDF)", "lt": ["Goodness attaches one to happiness", "passion to fruitive action, O Bharata", "but ignorance, covering knowledge", "attaches one to madness"], "mem": "Both work hard, but for different ends", "pp": ["This verse [[summarizes]] 14.6 to 14.8.", "Passion and ignorance both work hard, but they [[differ]].", "Passion: engages in fruitive action and owns as much as he can, sometimes spending for [[good causes]] like hospitals and charities.", "Ignorance: actions are good [[neither for him nor for others]]; he acts whimsically without regulative principles."], "appt": [], "vone": "In short: goodness to happiness, passion to action, ignorance to madness."}], "why": ["To describe the soul's entanglement: how the three modes bind the pure soul to matter by habituating him to various experiences and emotions.", "notes"], "from": {"prev": "Section 1", "t": "Section 1 identified Krishna as the source, the ultimate father, of all living entities. Now the placement of the souls under the control of material nature is described.", "src": "notes"}, "one": "Goodness binds by happiness, passion by action, ignorance by madness.", "nxt": "Which mode is in charge of a person right now?"}, {"id": "x14S3", "num": 3, "range": "14.10 – 14.13", "title": "Recognizing a mode’s supremacy", "gist": "The modes compete with one another for supremacy within an individual. Manifestation from goodness is knowledge; from passion, attachment, uncontrollable desire and intense endeavor; from ignorance, inactivity and madness.", "app": "", "q": [["What is the link between Section II and Section III?", "Does one mode become predominant within a person? If so, how? Krishna explains that the modes compete, and which one dominates depends on karma, association, food and so on."], ["What does Section III teach about recognizing the modes?", "14.10: the modes struggle for supremacy. 14.11–14.13: the external symptoms of each mode: goodness (all gates illuminated by knowledge), passion (attachment, uncontrollable desire, hankering, intense endeavor), ignorance (madness, illusion, inertia, darkness)."]], "fl": [["Symptoms of goodness", "All gates of the body illuminated by knowledge."], ["Symptoms of passion", "Great attachment, uncontrollable desire, hankering, intense endeavor."], ["Symptoms of ignorance", "Madness, illusion, inertia, darkness."]], "texts": [{"n": 10, "nl": "14.10", "label": "Text 14.10", "title": "The modes compete for supremacy", "gist": "The modes are not constant. Sometimes passion defeats goodness, sometimes goodness defeats passion, and so on. According to karma, association and food, one mode becomes predominant.", "focus": [["Purport (a): What is the “Vasudeva state,” and what must one intent on Krishna consciousness do?", "The state of pure goodness in which one can understand the science of God. One who is intent on advancing in Krishna consciousness has to transcend these three modes."], ["Purport (b): How are the modes identified?", "By the characteristics described in 14.11–14.13."]], "fc": [["abhibhūya", "Defeating, overpowering."], ["Vasudeva state", "Pure goodness, where the science of God can be understood."]], "cz": ["Sometimes the mode of {{passion}} becomes prominent, defeating the mode of {{goodness}}, O son of Bharata. And sometimes goodness defeats passion, and at other times the mode of {{ignorance}} defeats goodness and passion."], "ap": [["What in your daily choices of food, association and work pushes you toward a particular mode?", "Open-ended."]], "ex": "The three modes constantly compete inside us. Which one leads depends on our work, company and food, so the goal is to go beyond all three.", "verse": "rajas tamaś cābhibhūya\nsattvaṁ bhavati bhārata\nrajaḥ sattvaṁ tamaś caiva\ntamaḥ sattvaṁ rajas tathā", "tr": "Sometimes the mode of passion becomes prominent, defeating the mode of goodness, O son of Bharata. And sometimes the mode of goodness defeats passion, and at other times the mode of ignorance defeats goodness and passion. In this way there is always competition for supremacy.", "trlabel": "Translation (from your PDF)", "lt": ["Passion and ignorance having been overpowered", "goodness prevails, O Bharata", "passion prevails over goodness and ignorance", "and ignorance over goodness and passion"], "mem": "The modes compete; go beyond all three", "pp": ["The modes [[struggle to dominate]] each other.", "Which mode predominates depends on [[karma, association and food]].", "One intent on advancing in Krishna consciousness has to [[transcend]] the modes.", "\"[[Vasudeva state]]\": pure goodness, where one can understand the science of God.", "The modes are identified by the [[characteristics in 14.11 to 14.13]]."], "appt": [], "vone": "The modes compete, and one overpowers the others."}, {"n": 11, "nl": "14.11", "label": "Text 14.11", "title": "Symptoms of goodness", "gist": "Goodness is recognized when all the gates of the body are illuminated by knowledge.", "focus": [["Purport (a): What does “all gates illuminated by knowledge” imply?", "Perception by the senses based on knowledge, in the right position, and being clean inside and out."]], "fc": [["sarva-dvāreṣu prakāśa", "Illumination in all the gates (senses) of the body."]], "cz": ["The manifestations of the mode of {{goodness}} can be experienced when all the {{gates}} of the body are illuminated by {{knowledge}}."], "ap": [["What is one way to keep the “gates” of your senses clean today?", "Open-ended."]], "ex": "You can tell goodness is increasing when the senses work with clarity and knowledge.", "verse": "sarva-dvāreṣu dehe ’smin\nprakāśa upajāyate\njñānaṁ yadā tadā vidyād\nvivṛddhaṁ sattvam ity uta", "tr": "The manifestations of the mode of goodness can be experienced when all the gates of the body are illuminated by knowledge.", "trlabel": "Translation (from your PDF)", "lt": ["In all the gates of this body", "illumination appears", "when knowledge appears, then know", "that goodness has increased"], "mem": "Goodness: all the gates lit by knowledge", "pp": ["\"All gates illuminated by knowledge\": perception by the senses based on [[knowledge]], in the right position.", "Being [[clean inside and out]]."], "appt": [], "vone": "Goodness shows as knowledge lighting all the gates of the body."}, {"n": 12, "nl": "14.12", "label": "Text 14.12", "title": "Symptoms of passion", "gist": "When passion increases, great attachment, uncontrollable desire, hankering and intense endeavor develop.", "focus": [["Which four symptoms of increased passion does the verse list?", "Great attachment (lobha), uncontrollable desire, hankering, and intense endeavor."]], "fc": [["lobha", "Great attachment, greed."], ["ārambha", "Intense endeavor."]], "cz": ["... when there is an increase in the mode of passion, the symptoms of great {{attachment}}, uncontrollable {{desire}}, {{hankering}}, and intense {{endeavor}} develop."], "ap": [["Where do you see passion’s restless striving in your own week?", "Open-ended."]], "ex": "When passion rises, one becomes greedy, driven and endlessly busy, wanting more.", "verse": "lobhaḥ pravṛttir ārambhaḥ\nkarmaṇām aśamaḥ spṛhā\nrajasy etāni jāyante\nvivṛddhe bharatarṣabha", "tr": "O chief of the Bhāratas, when there is an increase in the mode of passion, the symptoms of great attachment, uncontrollable desire, hankering, and intense endeavor develop.", "trlabel": "Translation (from your PDF)", "lt": ["Great attachment, activity, intense endeavor", "uncontrollable restlessness, hankering", "these arise in the mode of passion", "when it increases, O best of the Bhāratas"], "mem": "Passion: greed, drive and restlessness", "pp": ["Symptoms: great [[attachment]], uncontrollable [[desire]], [[hankering]] and intense [[endeavor]].", "Example: one works hard for a [[palatial house]] as if it were eternal."], "appt": [], "vone": "Passion shows as greed, restless activity and hankering."}, {"n": 13, "nl": "14.13", "label": "Text 14.13", "title": "Symptoms of ignorance", "gist": "When ignorance increases, madness, illusion, inertia and darkness are manifested.", "focus": [["Purport (b)-(c): What do “darkness and inertia” and “illusion” imply?", "Darkness and inertia: not working by regulative principles, working whimsically for no purpose. Illusion: even though he has the capacity to work, he does not endeavor."]], "fc": [["aprakāśa", "Darkness."], ["apravṛtti", "Inertia."], ["moha", "Illusion."]], "cz": ["... when there is an increase in the mode of ignorance, {{madness}}, {{illusion}}, {{inertia}} and {{darkness}} are manifested."], "ap": [["How can you tell inertia from healthy rest?", "Open-ended."]], "ex": "Ignorance shows up as darkness, inertia, madness and illusion: not working properly even when able.", "verse": "aprakāśo ’pravṛttiś ca\npramādo moha eva ca\ntamasy etāni jāyante\nvivṛddhe kuru-nandana", "tr": "O son of Kuru, when there is an increase in the mode of ignorance madness, illusion, inertia and darkness are manifested.", "trlabel": "Translation (from your PDF)", "lt": ["Darkness, inertia", "madness and illusion", "these arise in the mode of ignorance", "when it increases, O son of Kuru"], "mem": "Ignorance: darkness, inertia, madness and illusion", "pp": ["[[Darkness and inertia]]: not working by regulative principles; working whimsically for [[no purpose]].", "[[Illusion]]: even though able to work, one does not [[endeavor]]."], "appt": [], "vone": "Ignorance shows as darkness, inertia, madness and illusion."}], "why": ["The modes are not constant in their influence. According to our karma, association, food and so on, a particular mode becomes predominant. So Krishna gives the symptoms by which we can recognize which mode is acting.", "notes"], "from": {"prev": "Section 2", "t": "Section 2 described the effects of each mode. The natural question: does one mode become predominant within a person, and how?", "src": "notes"}, "one": "The modes compete, and their symptoms show which one rules.", "nxt": "Where does the ruling mode lead, in action and at death?"}, {"id": "x14S4", "num": 4, "range": "14.14 – 14.18", "title": "Acting and dying within the modes", "gist": "Both the results of one’s action and the results after one’s death are predominated by a specific mode of nature and bring about certain results.", "app": "", "q": [["What is the main point of Section IV?", "Both the results of one’s action and the results after death are predominated by a specific mode of nature."], ["Match: 14.14–14.15, 14.16–14.18.", "14.14–14.15: death in different modes. 14.16–14.18: results of actions in different modes (see Summarized Theme 14A)."], ["What is the aim of human life according to the purport of 14.15?", "Take to goodness, take good association, and gradually transcend all three modes to be situated in Krishna consciousness."]], "fl": [], "texts": [{"n": 14, "nl": "14.14", "label": "Text 14.14", "title": "Death in goodness", "gist": "One who dies in the mode of goodness attains the pure higher planets.", "focus": [["Purport (a): What does “amalān” indicate, and how is goodness described?", "Amalān indicates being free from the modes of passion and ignorance. Goodness is the purest form of existence in the material world."]], "fc": [["amalān lokān", "Pure planets."], ["pralayaṁ yāti", "Meets death."]], "cz": ["When one dies in the mode of {{goodness}}, he attains to the pure {{higher planets}}."], "ap": [["Why is goodness not the final goal even though it leads to higher planets?", "It is still within the modes; the aim is to transcend all three (14.15 purport)."]], "ex": "Death while in goodness leads to the higher, purer planets.", "verse": "yadā sattve pravṛddhe tu\npralayaṁ yāti deha-bhṛt\ntadottama-vidāṁ lokān\namalān pratipadyate", "tr": "When one dies in the mode of goodness, he attains to the pure higher planets.", "trlabel": "Translation (from your PDF)", "lt": ["When goodness is predominant", "and the embodied one meets death", "then he attains the planets of those who know the highest", "the pure planets"], "mem": "Death in goodness leads to the pure planets", "pp": ["\"[[Amalān]]\" indicates being free from the modes of [[passion and ignorance]].", "Goodness is the [[purest form]] of existence in the material world."], "appt": [], "vone": "Dying in goodness leads to the pure higher planets."}, {"n": 15, "nl": "14.15", "label": "Text 14.15", "title": "Death in passion and ignorance", "gist": "Dying in passion, one is born among fruitive workers; dying in ignorance, one is born in the animal kingdom.", "focus": [["Purport (b): What does this verse refute, and what is the aim of human life?", "It refutes the idea that one can never go down from human life; the soul can go to lower existence. The aim of human life is to take to goodness, take good association, and gradually transcend all three modes to be situated in Krishna consciousness."]], "fc": [["karma-saṅgiṣu jāyate", "Born among those attached to fruitive activity."], ["mūḍha-yoniṣu", "Species of foolish (animal) life."]], "cz": ["When one dies in the mode of {{passion}}, he takes birth among those engaged in {{fruitive activities}}; and when he dies in the mode of {{ignorance}}, he takes birth in the {{animal kingdom}}."], "ap": [["What does this verse ask you to do about how you live now?", "Open-ended."]], "ex": "Death in passion brings another life of striving for results; death in ignorance can bring animal life. Human life is meant to rise to goodness and beyond.", "verse": "rajasi pralayaṁ gatvā\nkarma-saṁgiṣu jāyate\ntathā pralīnas tamasi\nmūḍha-yoniṣu jāyate", "tr": "When one dies in the mode of passion, he takes birth among those engaged in fruitive activities; and when he dies in the mode of ignorance, he takes birth in the animal kingdom.", "trlabel": "Translation (from your PDF)", "lt": ["Dying in passion", "he is born among those attached to fruitive activity", "and dying in ignorance", "he is born in the species of the foolish (animals)"], "mem": "One can fall after human life; aim to rise beyond the modes", "pp": ["After human life the soul can also go down to [[lower existence]].", "This refutes that one can never go down from [[human life]].", "Aim of human life: take to the mode of [[goodness]].", "Take to [[good association]].", "Gradually [[transcend all three modes]] and be situated in Krishna consciousness."], "appt": [], "vone": "Dying in passion or ignorance leads to fruitive-activity birth or animal life."}, {"n": 16, "nl": "14.16", "label": "Text 14.16", "title": "Results of actions in the modes", "gist": "Goodness purifies; passion results in distress; ignorance results in foolishness. (14.16–14.18: results of actions in different modes.)", "focus": [["Purport (a)-(b): What examples show passion’s and ignorance’s results?", "1. Passion results in misery: e.g. a skyscraper needs great toil for little happiness, and any “mental happiness” is only “I have this house or money.” Ignorance leads to misery: the performer lacks knowledge, so the activities lead to misery and next to animal life, which is always miserable, though under illusion one doesn’t see it.\n2. The grossest ignorance is slaughtering animals for the tongue, especially cow killing (Ṛg Veda)."], ["Purport (c)-(d): What warning and solution does Prabhupāda give?", "Human society is advancing in the wrong direction. Viṣṇu Purāṇa’s “namo brahmaṇya”: brāhmaṇas symbolize spiritual education and cows the most valuable food, both dear to Krishna. Real advancement means giving them protection. The solution: all nations should provide the easiest process, Krishna consciousness."]], "fc": [["sāttvikaṁ nirmalaṁ phalam", "The pure result of goodness."], ["duḥkham", "Distress (the fruit of passion)."]], "cz": ["By acting in the mode of {{goodness}}, one becomes {{purified}}. Works done in the mode of {{passion}} result in {{distress}}, and actions performed in the mode of {{ignorance}} result in {{foolishness}}."], "ap": [["Think of something you worked hard for. Was the result more purity, distress or foolishness, and which mode drove it?", "Open-ended."]], "ex": "The mode behind an action decides its result: purity from goodness, misery from passion, foolishness from ignorance.", "verse": "karmaṇaḥ sukṛtasyāhuḥ\nsāttvikaṁ nirmalaṁ phalam\nrajasas tu phalaṁ duḥkham\najñānaṁ tamasaḥ phalam", "tr": "By acting in the mode of goodness, one becomes purified. Works done in the mode of passion result in distress, and actions performed in the mode of ignorance result in foolishness.", "trlabel": "Translation (from your PDF)", "lt": ["Of pious action, they say", "the result is pure, in goodness", "but the result of passion is distress", "and the result of ignorance is foolishness"], "mem": "Passion brings misery, ignorance brings foolishness", "pp": ["Passion results in [[misery]]: e.g. building a skyscraper needs much toil for little happiness.", "Any \"happiness\" is only mental: \"I have this [[house or money]]\".", "Ignorance leads to misery: the performer lacks knowledge, so the next life is [[animal life]].", "Animal life is always miserable, but under [[illusion]] one does not understand this.", "Grossest ignorance: [[slaughtering animals]] for the taste of the tongue, especially [[cow killing]] (Ṛg Veda).", "Warning: society advances in the [[wrong direction]]. Viṣṇu Purāṇa \"namo brahmaṇya\": brāhmaṇas symbolize [[spiritual education]], cows the most valuable [[food]]; both must be protected.", "Solution: all nations should provide the easiest process, [[Krishna consciousness]], to save humanity."], "appt": [], "vone": "Goodness gives purity, passion distress, ignorance foolishness."}, {"n": 17, "nl": "14.17", "label": "Text 14.17", "title": "What each mode develops", "gist": "From goodness, real knowledge develops; from passion, grief (greed); from ignorance, foolishness, madness and illusion.", "focus": [["Purport (a)-(c): How does Krishna consciousness help, and why is ignorance irresponsible?", "It develops goodness in society so people see things as they are. Ignorance leaves people uneducated and irresponsible; e.g. one does not see the equal and opposite reactions of animal killing. Educating to stop irresponsible behavior makes one sober, and then happy and prosperous."], ["Purport (d)-(e): What if not everyone takes to this education?", "1. If even a certain percentage develops Krishna consciousness and becomes situated in goodness, there is peace and prosperity everywhere.\n2. Otherwise, under passion, people are greedy and restless and, even with money, unhappy; under ignorance they become mad and take shelter of intoxication, and the future is dark.\n3. Happiness is possible only in goodness through Krishna consciousness, not by earning money."]], "fc": [["lobha (rajas)", "Greed (from passion)."], ["ajñānam (tamas)", "Foolishness (from ignorance)."]], "cz": ["From the mode of {{goodness}}, real {{knowledge}} develops; from the mode of {{passion}}, grief develops; and from the mode of {{ignorance}}, foolishness, madness and illusion develop."], "ap": [["How does knowing what each mode develops help you choose what to read, eat or watch?", "Open-ended."]], "ex": "Each mode produces a matching outcome: knowledge, restless greed and grief, or foolishness and illusion. Only goodness, deepened by Krishna consciousness, brings peace.", "verse": "sattvāt sañjāyate jñānaṁ\nrajaso lobha eva ca\npramāda-mohau tamaso\nbhavato ’jñānam eva ca", "tr": "From the mode of goodness, real knowledge develops; from the mode of passion, grief develops; and from the mode of ignorance, foolishness, madness and illusion develop.", "trlabel": "Translation (from your PDF)", "lt": ["From goodness, knowledge develops", "from passion, greed (your PDF's translation says grief)", "from ignorance, madness and illusion", "arise, and also foolishness"], "mem": "Education in Krishna consciousness brings peace", "pp": ["Krishna consciousness develops [[goodness]] in society, so people see things [[as they are]].", "In ignorance one does not see things as they are because no [[education]] makes one irresponsible, e.g. not seeing the reactions of [[animal killing]].", "To stop irresponsible activities, [[educate]]. Education makes one sober, then [[happy and prosperous]].", "If even a certain [[percentage]] takes to Krishna consciousness and is in goodness, there is peace and prosperity all over.", "Under passion: greed and unlimited hankering; even with money there is no [[peace of mind]].", "Under ignorance: madness and distress, taking shelter of [[intoxication]]; the future is dark.", "Happiness is possible only in [[goodness]] by practicing Krishna consciousness, not just by [[earning money]]."], "appt": [], "vone": "Each mode develops its own result: knowledge, greed, madness and illusion."}, {"n": 18, "nl": "14.18", "label": "Text 14.18", "title": "Destinations of the three modes", "gist": "Those in goodness go upward; those in passion stay on the earthly planets; those in ignorance go downward.", "focus": [["Purport (a)-(c): Where do the modes lead, and what is special about passion?", "1. By degree of goodness one goes to the higher planetary systems.\n2. Passion is usually mixed between goodness and ignorance; even in pure passion one remains on earth as a king or rich man, otherwise may go down or even go mad next life, and cannot forcibly go higher.\n3. Ignorance is the lowest, most risky; according to degree one comes to any of the 8 million species.\n4. “Tamasaḥ” describes those who stay in ignorance with a very dark future."], ["Purport (d): How is Krishna consciousness described here?", "As the system and opportunity to elevate to the higher mode of goodness."]], "fc": [["ūrdhvaṁ / madhye / adhaḥ", "Upward / in the middle / downward."], ["jaghanya-guṇa-vṛtti-stha", "Situated in the lowest mode’s activities."]], "cz": ["Those situated in the mode of {{goodness}} gradually go {{upward}} to the higher planets; those in the mode of {{passion}} live on the {{earthly}} planets; and those in the mode of {{ignorance}} go {{down}} to the hellish worlds."], "ap": [["Which of the three directions does your current lifestyle point to?", "Open-ended."]], "ex": "Goodness leads up, passion keeps one on earth, ignorance leads down. Krishna consciousness is the way to rise higher.", "verse": "ūrdhvaṁ gacchanti sattva-sthā\nmadhye tiṣṭhanti rājasāḥ\njaghanya-guṇa-vṛtti-sthā\nadho gacchanti tāmasāḥ", "tr": "Those situated in the mode of goodness gradually go upward to the higher planets; those in the mode of passion live on the earthly planets; and those in the mode of ignorance go down to the hellish worlds.", "trlabel": "Translation (from your PDF)", "lt": ["Upward go those situated in goodness", "in the middle stay the passionate", "those in the lowest mode's activities", "go downward, the ignorant"], "mem": "Goodness goes up, passion stays in the middle, ignorance goes down", "pp": ["By the degree of goodness one goes to different [[upper planetary systems]].", "Passion is usually [[mixed]] between goodness and ignorance.", "Even in pure passion one remains on earth as a [[king or rich man]]; otherwise one may go down or even go mad. One cannot [[forcibly]] go to higher planets.", "Ignorance is the [[lowest quality]] and very risky; by degree one takes any of the [[8 million species]].", "\"[[Tamasaḥ]]\": those who stay in ignorance without rising have a very dark future.", "Krishna consciousness is the system and [[opportunity]] to elevate to goodness."], "appt": [], "vone": "Goodness goes up, passion stays in the middle, ignorance goes down."}], "why": ["To show that both the results of one's action and the results after one's death are governed by the predominant mode.", "notes"], "from": {"prev": "Section 3", "t": "Section 3 showed how to recognize which mode is in charge. Section 4 shows where it leads: what happens at death and what each mode's action produces.", "src": "mine"}, "one": "Each mode gives its own results in action and its own destination at death.", "nxt": "So how does one get beyond the modes?"}, {"id": "x14S5", "num": 5, "range": "14.19 – 14.27", "title": "Transcending the modes", "gist": "One transcends all the modes by knowing two points: everything in this world takes place under the modes, and Krishna’s activities are transcendental to the modes. Krishna explains that one can transcend them by engaging unfailingly in full devotional service, and then comes to the Brahman platform, of which Krishna is the source.", "app": "Jñāna stresses discrimination. Discrimination leads one to appreciate that he is not the body, that Krishna is Supreme, and that he should take shelter of Krishna to become free. Thus jñāna is a path that culminates in bhakti.", "q": [["What is the link between Section IV and Section V?", "Having described the all-pervasive control of the modes, Krishna tells how to transcend them and explains His own position in relation to them."], ["Practical application of Section V?", "Jñāna stresses discrimination, which leads one to appreciate that he is not the body, that Krishna is Supreme, and that he should take shelter of Krishna to become free. Jñāna is thus a path that culminates in bhakti."], ["Where does each of Arjuna’s three questions (14.21) get answered, and how does the chapter end?", "Symptoms and behavior: 14.22–14.25. How to transcend: 14.26 (pure devotional service, coming to the Brahman level). 14.27: Krishna is the basis of the impersonal Brahman, so the chapter again stresses bhakti."], ["What is the link between 14.26 and 14.27?", "One may ask why one in full devotional service attains Brahman when his desire is Krishna’s service, not Brahman realization. Krishna clarifies by describing His relationship to Brahman."]], "fl": [], "texts": [{"n": 19, "nl": "14.19", "label": "Text 14.19", "title": "Platform of real knowledge", "gist": "All material activities are done by the three modes, and the Supreme Lord controls the modes. Seeing this, one attains Krishna’s spiritual nature.", "focus": [["Purport (a)-(b): Whom should one learn this science from, and how does one transcend?", "From proper souls. The real spiritual master is Krishna, who gave the knowledge to Arjuna, so learn it from one fully in Krishna consciousness; otherwise life is misdirected. Know your real position and how you are entrapped in the modes, and become fixed in Krishna consciousness by the spiritual master’s instructions (Bg. 7.14)."], ["Practical application: Why is Krishna the ultimate authority?", "Because He is unaffected by the limitations and illusions of material nature. One who has taken shelter of Him is also free from the modes and can impart knowledge that liberates from them."]], "fc": [["mad-bhāvam adhigacchati", "Attains My spiritual nature."], ["guṇebhyaḥ paraṁ vetti", "Knows the One beyond the modes."]], "cz": ["... the Supreme Lord is {{transcendental}} to all these modes, then you can know My {{spiritual nature}}."], "ap": [["Whose guidance do you rely on to understand reality, and why do you trust them?", "Open-ended."]], "ex": "Nature’s modes perform all material action, and Krishna is above them. Knowing this from a proper authority leads to Krishna’s nature.", "verse": "nānyaṁ guṇebhyaḥ kartāraṁ\nyadā draṣṭānupaśyati\nguṇebhyaś ca paraṁ vetti\nmad-bhāvaṁ so ’dhigacchati", "tr": "When you see that there is nothing beyond these modes of nature in all activities and that the Supreme Lord is transcendental to all these modes, then you can know My spiritual nature.", "trlabel": "Translation (from your PDF)", "lt": ["No agent other than the modes", "when the seer sees this", "and knows the One beyond the modes", "he attains My nature"], "mem": "Learn from the proper authority: Krishna", "pp": ["One can transcend by understanding this science from [[proper souls]].", "The real spiritual master is [[Krishna]], who gave the knowledge to Arjuna.", "Learn it from one [[fully in Krishna consciousness]]; otherwise life is misdirected.", "Know your real position and how you are [[entrapped in the modes]], and become fixed in Krishna consciousness by the [[spiritual master's instructions]].", "Bg. [[7.14]]: surrender in Krishna consciousness helps overcome the modes."], "appt": ["One can understand reality only from [[proper authorities]].", "Sri Krishna is the ultimate authority because He is [[unaffected by the limitations and illusions]] of material nature.", "One who has taken shelter of Sri Krishna is also free from the modes and can impart knowledge that [[brings liberation]] from them."], "vone": "Seeing that the modes act, and that Krishna is beyond them, one reaches His nature."}, {"n": 20, "nl": "14.20", "label": "Text 14.20", "title": "Result of transcending the modes", "gist": "One who transcends the three modes becomes free from birth, death, old age and their distresses and enjoys nectar even in this life.", "focus": [["Notes (theme): What are the results, and what does “dehī” indicate?", "Liberation from distress; devotional service is a sign of liberation (Bg. 18); one relishes nectar in this life. “Dehī” indicates that even within a material body one can be free from the modes and enjoy spiritual happiness here, until one goes to the spiritual sky where happiness is full. (No separate purport section in the notes.)"]], "fc": [["amṛtam aśnute", "Enjoys nectar."], ["dehī", "The embodied being."]], "cz": ["When the {{embodied being}} is able to transcend these three modes, he can become free from {{birth}}, {{death}}, {{old age}} and their distresses and can enjoy {{nectar}} even in this life."], "ap": [["What would it mean to taste a little “nectar” in this life?", "Open-ended. Example: steady inner satisfaction not dependent on outer changes."]], "ex": "Going beyond the three modes frees you from birth, death, old age and disease, and lets you taste real happiness even now.", "verse": "guṇān etān atītya trīn\ndehī deha-samudbhavān\njanma-mṛtyu-jarā-duḥkhair\nvimukto ’mṛtam aśnute", "tr": "When the embodied being is able to transcend these three modes, he can become free from birth, death, old age and their distresses and can enjoy nectar even in this life.", "trlabel": "Translation (from your PDF)", "lt": ["Having transcended these three modes", "the embodied one, (modes) born of the body", "from birth, death, old age and distress", "freed, he enjoys nectar"], "mem": "Beyond the modes: nectar even in this life", "pp": ["One becomes [[liberated]], free from distress.", "[[Devotional service]] in Krishna consciousness is a sign of liberation (Bg. 18).", "One can relish [[nectar]] even in this life, on the spiritual platform.", "\"[[Dehī]]\": even within the material body one can be free from the modes.", "One enjoys spiritual happiness even in this body, [[till one goes to the spiritual sky]] where full happiness is available."], "appt": [], "vone": "Beyond the modes, one is free from birth, death and old age, and enjoys nectar."}, {"n": 21, "nl": "14.21", "label": "Text 14.21", "title": "Arjuna’s three questions", "gist": "Arjuna asks: by what symptoms is one known who has transcended the modes, what is his behavior, and how does he transcend them?", "focus": [["What are the three questions, and where are they answered?", "1. Symptoms of one who has transcended, and 2. his behavior: answered in 14.22–14.25. 3. How he transcends: answered in 14.26."]], "fc": [["kair liṅgaiḥ", "By what symptoms."], ["kim ācāraḥ", "What is his behavior."], ["kathaṁ ativartate", "How does he transcend."]], "cz": ["... by what {{symptoms}} is one known who is transcendental to those modes? What is his {{behavior}}? And {{how}} does he transcend the modes of nature?"], "ap": [["Which of Arjuna’s three questions matters most for you right now?", "Open-ended."]], "ex": "Arjuna asks how to recognize a transcendentalist, how he behaves, and how anyone can reach that state.", "verse": "arjuna uvāca\nkair liṁgais trīn guṇān etān\natīto bhavati prabho\nkim ācāraḥ kathaṁ caitāṁs\ntrīn guṇān ativartate", "tr": "Arjuna inquired: O my dear Lord, by what symptoms is one known who is transcendental to those modes? What is his behavior? And how does he transcend the modes of nature?", "trlabel": "Translation (from your PDF)", "lt": ["Arjuna said", "By what symptoms is one known who has crossed these three modes", "transcendental, O Lord", "what is his behavior, and how", "does he transcend the three modes"], "mem": "Arjuna's three questions", "pp": ["First: what are the [[symptoms]] of one who has transcended the modes?", "Second: what is his [[behavior]]?", "Third: [[how]] does he transcend the modes?", "The first two are answered in [[14.22 to 14.25]], the third in [[14.26]]."], "appt": [], "vone": "Arjuna asks about the symptoms, the behavior, and the way to transcend the modes."}, {"n": 22, "nl": "14.22–14.25", "label": "Texts 14.22–14.25", "title": "Symptoms and behavior of the transcendentalist", "gist": "Answers to Arjuna’s first two questions. One who has transcended does not hate or long for illumination, attachment and delusion; sits like one unconcerned; is steady in praise and blame, honor and dishonor, friend and enemy. He does not act for his own sake but can act for Krishna.", "focus": [["Purport (a): What are the symptoms of transcendence?", "Free from envy and hankering; no desire for or repulsion from illumination, attachment and delusion. This implies acting neutrally while in the body, engaging in devotional service so identification with the body is forgotten, not needing the body’s dictations. He is equiposed, knowing only the modes act, and neither desires to enjoy the body nor to leave it."], ["Purport (b): What is his behavior?", "1. Steady in praise and blame, honor and dishonor, happiness and distress, desirable and undesirable.\n2. He deals equally with earth, stone and gold (accepting whatever favors his duty in Krishna consciousness) and with friend and enemy (dear friend to anyone who helps in Krishna consciousness, no hatred for “enemies”).\n3. Social and political issues do not affect him; he knows upheavals are temporary and does nothing for his own sake, but can attempt anything for Krishna."], ["Purport (c): What is the basic point in both symptoms and behavior?", "A soul liberated by cultivating knowledge of the modes is detached from matter and from the push of the modes."], ["Practical application", "When one desires neither attainment of pleasure nor escape from pain, he has transcended the modes. The embodied soul will always undergo loss and gain, but the liberated soul remains unaffected by focusing his identity within."]], "fc": [["udāsīna-vat", "Like one unconcerned."], ["sama-duḥkha-sukhaḥ", "Equal in distress and happiness."], ["sarvārambha-parityāgī", "Gives up all fruitive endeavors (for his own sake)."]], "cz": ["He who does not hate {{illumination}}, {{attachment}} and {{delusion}} when they are present, nor longs for them when they {{disappear}}; who is seated like one {{unconcerned}}, ..."], "ap": [["In which situation (praise, blame, gain, loss) do you most need steadiness this week?", "Open-ended."]], "ex": "The
