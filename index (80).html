 transcendentalist is not pushed around by the modes. He is calm in every dualistic situation, treats all alike, and acts only for Krishna.", "verse": "śrī-bhagavān uvāca\nprakāśaṁ ca pravṛttiṁ ca\nmoham eva ca pāṇḍava\nna dveṣṭi sampravṛttāni\nna nivṛttāni kāṁkṣati\nudāsīna-vad āsīno\nguṇair yo na vicālyate\nguṇā vartanta ity evaṁ\nyo ’vatiṣṭhati neṁgate\nsama-duḥkha-sukhaḥ sva-sthaḥ\nsama-loṣṭāśma-kāñcanaḥ\ntulya-priyāpriyo dhīras\ntulya-nindātma-saṁstutiḥ\nmānāpamānayos tulyas\ntulyo mitrāri-pakṣayoḥ\nsarvārambha-parityāgī\nguṇātītaḥ sa ucyate", "tr": "The Blessed Lord said: He who does not hate illumination, attachment and delusion when they are present, nor longs for them when they disappear; who is seated like one unconcerned, being situated beyond these material reactions of the modes of nature, who remains firm, knowing that the modes alone are active; who regards alike pleasure and pain, and looks on a clod, a stone and a piece of gold with an equal eye; who is wise and holds praise and blame to be the same; who is unchanged in honor and dishonor, who treats friend and foe alike, who has abandoned all fruitive undertakings—such a man is said to have transcended the modes of nature.", "trlabel": "Translation (from your PDF)", "lt": ["The Blessed Lord said", "Illumination and attachment", "and delusion, O son of Pāṇḍu", "he does not hate when they are present", "nor long for them when they disappear", "seated like one unconcerned", "who is not disturbed by the modes", "knowing that the modes alone are active", "he remains firm and does not waver", "equal in distress and happiness, situated in the self", "equal toward a clod, a stone and gold", "the same toward the dear and the not dear, wise", "the same in blame and in praise of himself", "the same in honor and dishonor", "the same toward the side of friend and of foe", "he who has given up all fruitive undertakings", "is said to have transcended the modes"], "mem": "Steady, equal and unmoved by the modes; acts only for Krishna", "pp": ["Symptoms: [[free from envy and hankering]]; no desire for or repulsion from illumination, attachment and delusion.", "While in the body one acts [[neutrally]], engaged in devotional service so that identification with the body is forgotten.", "Equiposed and detached, knowing that the [[modes alone are active]]; he neither desires to [[enjoy the body]] nor to [[go out of it]].", "Behavior: steady in praise and blame, [[honor and dishonor]], happiness and distress.", "Deals equally with [[earth, stone and gold]], accepting what favors his duty in Krishna consciousness.", "[[Friend or enemy]]: takes anyone who helps in Krishna consciousness as a dear friend; does not hate so-called enemies.", "[[Social and political issues]] do not affect him; he knows upheavals are temporary.", "Does nothing for his [[own sake]], but can attempt anything for Krishna.", "Basic point: liberated by knowledge of the modes, he is [[detached]] from matter and the pushing of the modes."], "appt": ["When one desires [[neither attainment of pleasure nor escape from pain]], he has transcended the modes of nature.", "The embodied soul always undergoes dualities of loss and gain, but the liberated soul remains unaffected by [[focusing his identity within]]."], "link": {"prev": "14.21", "t": "Arjuna asked three questions in 14.21. Texts 14.22 to 14.25 answer the first two: the symptoms and the behavior of one who has transcended the modes.", "src": "notes"}, "vone": "The transcendentalist is steady, equal in all dualities, and acts only for Krishna."}, {"n": 26, "nl": "14.26", "label": "Text 14.26", "title": "How to transcend: pure devotional service", "gist": "One who engages in full, unfailing devotional service transcends the modes at once and comes to the level of Brahman. (This answers Arjuna’s third question.)", "focus": [["Purport (a)-(d): What is the method of transcending?", "Transfer your consciousness to Krishna’s activities, bhakti-yoga, without disturbing it with activities in the three modes. This includes all His plenary expansions, all equally omnipotent, omniscient, transcendental and sac-cid-ānanda. Service with unfailing determination to any form overcomes the modes (Bg. 7.14)."], ["Purport (e): What qualification is needed to serve Krishna, and what analogies are used?", "To be in Krishna consciousness means acquiring qualitative equality with Krishna (sac-cid-ānanda). Analogies: a gold mine and a particle of gold; a king’s personal assistant must acquire the qualifications. The qualification is “to become Brahman,” freed from material contamination, without losing eternal individual identity."], ["Purport (f): What three things must be present in bhakti-yoga?", "The Lord, the devotee, and the process of bhakti. Individuality in service is an eternal fact."]], "fc": [["avyabhicāreṇa", "Without deviation, unfailing."], ["brahma-bhūyāya kalpate", "Becomes qualified for Brahman."]], "cz": ["One who engages in full {{devotional service}}, who does not {{fall down}} in any circumstance, at once {{transcends}} the modes of material nature and thus comes to the level of {{Brahman}}."], "ap": [["What would “not falling down in any circumstance” look like in your practice?", "Open-ended. Example: keeping a minimum daily chanting even on hard days."]], "ex": "Pure, unfailing devotional service is the way to cross the modes. It puts one on the Brahman platform and keeps individuality.", "verse": "māṁ ca yo ’vyabhicāreṇa\nbhakti-yogena sevate\nsa guṇān samatītyaitān\nbrahma-bhūyāya kalpate", "tr": "One who engages in full devotional service, who does not fall down in any circumstance, at once transcends the modes of material nature and thus comes to the level of Brahman.", "trlabel": "Translation (from your PDF)", "lt": ["And one who, without deviation", "serves Me in devotional yoga", "he, completely transcending these modes", "becomes fit for the Brahman level"], "mem": "Unfailing bhakti transcends the modes", "pp": ["Solution: transfer your consciousness to Krishna's activities, [[bhakti-yoga]], without disturbing it by the modes.", "Service to [[any form]] of Krishna, including His plenary expansions, is transcendental.", "All forms are [[equipotent]]: omnipotent, omniscient, transcendental and [[sac-cid-ānanda]].", "Service with [[unfailing determination]] overcomes the modes (Bg. 7.14).", "Qualification to serve: [[qualitative equality]] with Krishna. Analogies: a gold mine and a particle of gold; a king's personal assistant.", "The qualification is \"to become [[Brahman]]\", freed from material contamination, without losing [[eternal individual identity]].", "Bhakti-yoga needs [[three things]]: the Lord, the devotee and the process of bhakti."], "appt": [], "link": {"prev": "14.25", "t": "The third question, how one transcends the modes, is answered: by pure devotional service one transcends them and reaches the Brahman level.", "src": "notes"}, "vone": "Unfailing devotional service transcends the modes."}, {"n": 27, "nl": "14.27", "label": "Text 14.27", "title": "Krishna is the basis of impersonal Brahman", "gist": "Krishna says He is the basis of the impersonal Brahman, which is immortal, imperishable, eternal and the constitutional position of ultimate happiness.", "focus": [["Purport (a)-(b): What are the characteristics of Brahman, and what is the sequence of realization?", "1. Immortal, imperishable, eternal, and the constitutional position of ultimate happiness.\n2. Brahman is the first stage of realizing the Absolute Truth; both Brahman and Paramātmā are within the realization of the Supreme Person.\n3. The living entity is conditioned when the Lord impregnates the spiritual living entity into material nature (Bg. 7.4–7.5); by cultivating spiritual knowledge he rises to the Brahman conception, transcendental to the material position, but Brahman realization is not perfect; one may stay or rise to Bhagavān realization, e.g. the four Kumāras."], ["Purport (c)-(d): Why must one elevate, and why is devotion safest?", "1. If one does not go beyond the impersonal Brahman there is a risk of falldown, since the intelligence is not perfectly cleared.\n2. Devotional service includes all the characteristics of Brahman realization.\n3. The Taittirīya Upaniṣad says the Supreme Person is the reservoir of pleasure; a devotee approaching Him exchanges the six opulences, like a servant of a king enjoying opulence equal to the king’s."], ["Purport (e): Summarize Chapter 14.", "1. The living entity, though Brahman in nature, desires to lord it over material nature; that desire makes him fall.\n2. Association with the modes makes him seek to dominate in different bodies.\n3. Krishna consciousness immediately puts one on the transcendental platform and removes the unlawful desire to control; practicing the nine processes in the association of devotees under the spiritual master, one becomes fixed in devotional service and equal in quality to the Lord."]], "fc": [["pratiṣṭhā", "The basis, foundation."], ["brahmaṇo pratiṣṭhā", "The basis of Brahman."]], "cz": ["And I am the {{basis}} of the impersonal {{Brahman}}, which is the constitutional position of ultimate {{happiness}}, and which is {{immortal}}, imperishable and eternal."], "ap": [["Why is being in devotion “safer” than stopping at Brahman realization?", "The notes: risk of falldown at the impersonal stage; devotion includes all the qualities of Brahman and adds relationship."]], "ex": "Krishna is the source and support of Brahman. Devotion includes all the qualities of Brahman realization, so it is the safest and most complete goal.", "verse": "brahmaṇo hi pratiṣṭhāham\namṛtasyāvyayasya ca\nśāśvatasya ca dharmasya\nsukhasyaikāntikasya ca", "tr": "And I am the basis of the impersonal Brahman, which is the constitutional position of ultimate happiness, and which is immortal, imperishable and eternal.", "trlabel": "Translation (from your PDF)", "lt": ["For I am the basis of Brahman", "of the immortal and imperishable", "of the eternal constitutional position", "and of ultimate happiness"], "mem": "Krishna is the basis of Brahman; devotion is safest", "pp": ["Brahman is [[immortal, imperishable, eternal]] and the position of ultimate happiness.", "Brahman is the [[first stage]] of realizing the Absolute Truth; Brahman and Paramātmā are within the realization of the Supreme Person.", "The living entity is conditioned when the Lord [[impregnates]] him into nature (Bg. 7.4 to 7.5); by cultivating knowledge he rises to the [[Brahman conception]].", "Brahman realization is [[not perfect]]: one may stay there or rise to Bhagavān realization, e.g. the [[four Kumāras]].", "If one does not rise beyond impersonal Brahman there is a [[risk of falldown]], since the intelligence is not perfectly cleared.", "[[Devotional service]] is the safest position: it includes all the characteristics of Brahman; the devotee and the Lord exchange the [[six opulences]].", "Summary: the living entity, though Brahman in nature, desires to [[lord it over]] material nature, and that desire makes him fall.", "Krishna consciousness immediately puts one on the [[transcendental position]]; practicing the [[nine processes]] with devotees under the spiritual master removes the desire to dominate."], "appt": [], "link": {"prev": "14.26", "t": "One may ask why one in full devotional service attains Brahman when his desire is Krishna's service, not Brahman realization. Krishna clarifies by describing His own relationship to Brahman, and thus stresses bhakti again.", "src": "notes"}, "vone": "Krishna is the basis of Brahman, so devotion is the safest goal."}], "why": ["To show how to transcend the modes and to explain His own position in relation to them. One transcends by knowing that everything in this world happens under the modes and that Krishna is transcendental to them, and by engaging unfailingly in devotional service.", "notes"], "from": {"prev": "Section 4", "t": "Having described the all-pervasive control of the modes, Krishna now tells how to transcend them and explains His own position in relation to them.", "src": "notes"}, "one": "Transcend the modes by unfailing devotion; Krishna is the basis of Brahman.", "nxt": null}], "lead": "From Chapter 13: the soul is entangled in nature through his desire to enjoy, so now we see how the three modes bind him."}]};

  s.texts.forEach(t=>{
    const l=core(forScope(t.scope)),c=counts(l);
    h+=`<button class="unit lv-vs lvbar" onclick="openText('${t.scope}')"><div class="t"><small>${t.label}</small><div>${esc(t.title)}</div></div><div style="width:64px;text-align:right"><div class="note" style="margin-bottom:4px">${c.g2}/${c.t}</div>${pbar(l)}</div></button>`;
  });
  h+=`<h2 style="margin-top:20px">Test</h2>
  <div class="row"><button class="pri flex" onclick="openPick('sec','${s.id}','Section ${s.num} · ${s.range}')">Test this section</button><button class="flex" onclick="begin(shuffle(missed(forSec('${s.id}'))),'Missed')" ${mi?'':'disabled'}>Review missed (${mi})</button></div>
  <h2 style="margin-top:20px">Score</h2><div class="card">${scoreBlock(its)}</div>
  <div style="margin-top:8px">${rbtn('sec',s.id,'Reset this section')}</div>`;
  return h;
}
function openPick(ctx,key,label){S.pick={ctx,key,label};S.pickFrom=S.screen;S.screen='pick';render()}
function pickItems(){const p=S.pick;return p.ctx==='verse'?forScope(p.key):p.ctx==='sec'?forSec(p.key):AI()}
function quickList(l){return shuffle(l.map(i=>({i,s:(G[i.id]===undefined?1:G[i.id]===0?0:G[i.id]===1?.5:2)+Math.random()*.9})).sort((a,b)=>a.s-b.s).slice(0,15).map(x=>x.i))}
function chunk(l){
  if(l.length<=25)return l;
  const un=l.filter(i=>G[i.id]===undefined);if(un.length)return un.slice(0,20);
  const wk=l.filter(i=>G[i.id]===0||G[i.id]===1);if(wk.length)return wk.slice(0,20);
  return shuffle(l).slice(0,20);
}
function pickGo(k){
  const l=pickItems().filter(i=>inKind(i,k)),name=KINDS.find(x=>x[0]===k)[1];
  setPref('gita13:kind',k);
  if(S.pick.ctx==='quick'){S.next=null;begin(quickList(l),'Quick 15 · '+name);return}
  const c=S.pick.ctx==='verse'?l:chunk(l);
  S.next=c.length<l.length?k:null;
  begin(c,S.pick.label+' · '+name+(c.length<l.length?' · next '+c.length:''));
}
function pickScreen(){
  const its=pickItems();
  let h=topbar(`<button class="link" onclick="S.screen=S.pickFrom;render()">‹ Back</button>`)+`<h1>What do you want to practice?</h1><p class="sub">${esc(S.pick.label)}</p>`;
  const last=pref('gita13:kind','',['flow','pp','mem','all']);
  KINDS.forEach(k=>{
    const l=its.filter(i=>inKind(i,k[0])),c=counts(l),un=l.filter(i=>G[i.id]===undefined).length,big=l.length>25&&S.pick.ctx!=='verse'&&S.pick.ctx!=='quick';
    h+=`<button class="sec card lvbar" style="${last===k[0]?'box-shadow:inset 0 0 0 2px var(--lv)':''}" onclick="pickGo('${k[0]}')" ${l.length?'':'disabled'}><div class="r">${k[1].toUpperCase()}${last===k[0]?' · LAST USED':''}</div><div class="tt">${k[2]}</div><div class="note">${l.length?(big?l.length+' questions · '+un+' not yet · runs 20 at a time':l.length+' questions · '+c.g2+' got it'):'No questions here yet'}</div></button>`;
  });
  return h;
}
function toggleBm(sc){if(B[sc])delete B[sc];else B[sc]=1;save();const b=$('#bmb');if(b)b.textContent=B[sc]?'★ Bookmarked':'☆ Bookmark this verse'}
let jt=null;
function jn(sc,k,v){N[sc]=N[sc]||{};N[sc][k]=v;clearTimeout(jt);jt=setTimeout(save,600)}
function journal(t){
  const n=N[t.scope]||{},has=n.n||n.o||n.k;
  const f=(lab,k)=>`<div class="lb2">${lab}</div><textarea style="min-height:64px;margin-bottom:8px" oninput="jn('${t.scope}','${k}',this.value)">${esc(n[k]||'')}</textarea>`;
  return det(t.scope+':jn','My reflection'+(has?' (written)':''),`<div class="card" style="margin-top:4px">${f('Notice','n')}${f('Observe','o')}${f('Thank Krishna','k')}<p class="note" style="margin:0">Only you see this. It saves as you type.</p></div>`);
}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function doSearch(q){
  const el=$('#sres');if(!el)return;
  const words=norm(q).split(/\s+/).filter(Boolean);
  if(!words.length){el.innerHTML='';return}
  const res=[];
  SECS.filter(s=>s.ch.num===CH).forEach(s=>s.texts.forEach(t=>{
    const h=t._h||(t._h=norm([t.label,t.title,t.gist,t.mem||'',(t.pp||[]).join(' ').replace(/\[\[|\]\]/g,''),t.tr||'',t.verse,(t.lt||[]).join(' ')].join(' ')));
    if(words.every(w=>h.includes(w)))res.push(t);
  }));
  el.innerHTML=res.length?res.slice(0,10).map(t=>`<button class="unit lv-vs lvbar" onclick="openText('${t.scope}')"><div class="t"><small>${t.label}</small><div>${esc(t.title)}</div></div></button>`).join(''):`<p class="note">No verse matches.</p>`;
}
function startCount(t){const L=t.verse.split('\n');return Math.min(L.length,/uvāca\s*$/.test(L[0])?2:1)}
function reciteInner(t){
  const L=t.verse.split('\n'),shown=S.rv[t.scope]===undefined?startCount(t):S.rv[t.scope];
  return `<div class="verse" style="margin-top:0">${L.map((x,i)=>i<shown?esc(x):'· · ·').join('\n')}</div><div class="row"><button class="flex" onclick="revLine('${t.scope}')" ${shown>=L.length?'disabled':''}>Show next line</button><button class="flex" onclick="revAll('${t.scope}',true)">Show all</button><button class="flex ghost" onclick="revAll('${t.scope}',false)">Hide</button></div><p class="note" style="margin:8px 0 0">Say the next line aloud before you tap Show next line.</p>`;
}
function revLine(sc){const t=TEXTS[sc],n=t.verse.split('\n').length,cur=S.rv[sc]===undefined?startCount(t):S.rv[sc];S.rv[sc]=Math.min(n,cur+1);const el=$('#rc');if(el)el.innerHTML=reciteInner(t)}
function revAll(sc,all){const t=TEXTS[sc];S.rv[sc]=all?t.verse.split('\n').length:startCount(t);const el=$('#rc');if(el)el.innerHTML=reciteInner(t)}
function lineTr(t){
  if(!t.lt)return '';
  const L=t.verse.split('\n');
  return det(t.scope+':lt','Line by line translation',`<div class="card" style="margin-top:4px">${L.map((x,i)=>`<div class="ln"><div class="sk">${esc(x)}</div><div class="en">${esc(t.lt[i]||'')}</div></div>`).join('')}</div>`);
}
function reciteBlock(t){
  if(!t.lt)return '';
  return det(t.scope+':rc','Practice reciting the Sanskrit',`<div class="card" style="margin-top:4px"><div id="rc">${reciteInner(t)}</div></div>`);
}
function studyBlocks(t){
  let h='';
  if(t.pp&&t.pp.length)h+=det(t.scope+':pp','Purport points',`<div class="card" style="margin-top:4px">${t.pp.map((p,i)=>`<div class="pt"><span class="n">${i+1}</span><span>${fmt(p)}</span></div>`).join('')}</div>`);
  const own=t.appt&&t.appt.length,a=own?t.appt:(t.sec.app?[t.sec.app]:[]);
  if(a.length)h+=det(t.scope+':ap','Application',`<div class="card" style="margin-top:4px"><span class="src">From your notes${own?'':' (section)'}</span>${a.length>1?a.map((p,i)=>`<div class="pt"><span class="n">${i+1}</span><span>${fmt(p)}</span></div>`).join(''):`<p style="margin:0">${fmt(a[0])}</p>`}</div>`);
  return h;
}
function txtScreen(){
  const t=TEXTS[S.txt],k=t.scope,its=forScope(k),mi=missed(its).length,sc=counts(core(its));
  return topbar(`<button class="link" onclick="openSec('${t.sec.id}')">‹ Section ${t.sec.num}</button>`)+`
  <span class="tag">${t.label}</span><h1>${esc(t.title)}</h1>
  <button class="ghost" id="bmb" style="margin:0 0 8px" onclick="toggleBm('${k}')">${B[k]?'★ Bookmarked':'☆ Bookmark this verse'}</button>
  <div class="verse">${esc(t.verse)}</div>
  ${t.link?`<div class="gistbox"><b>How it flows from ${esc(t.link.prev)}.</b> ${esc(t.link.t)}<br><span class="src">${srcLab(t.link.src)}</span></div>`:''}
  <h2 style="margin-top:16px">Study</h2>
  <div class="lb2" style="margin-top:8px">Read</div>
  ${lineTr(t)}
  ${det(k+':pg','Peek: gist',`<div class="gistbox">${esc(t.gist)}</div>`)}
  ${t.tr?det(k+':pt','Peek: '+t.trlabel.toLowerCase(),`<div class="gistbox">${esc(t.tr)}</div>`):''}
  ${t.mem?det(t.scope+':mem','Memory line',`<div class="hook" style="margin:0 0 10px">${esc(t.mem)}</div>`):''}
  ${studyBlocks(t)}
  <div class="lb2" style="margin-top:14px">Practice</div>
  ${reciteBlock(t)}
  ${journal(t)}
  <h2 style="margin-top:20px">Test</h2>
  <div class="row"><button class="pri flex" onclick="openPick('verse','${k}','${t.label}')">Test this verse</button><button class="flex" onclick="begin(shuffle(missed(forScope('${k}'))),'Missed')" ${mi?'':'disabled'}>Review missed (${mi})</button></div>
  <h2 style="margin-top:20px">Score</h2><div class="card">${scoreBlock(its)}</div>
  <div style="margin-top:8px">${rbtn('scope',k,'Reset this verse')}</div>`;
}
function quiz(){
  const it=S.queue[S.idx],pct=Math.round(S.idx/S.queue.length*100);
  let h=`<div class="top"><button class="link" onclick="back2()">‹ Exit</button><span class="note">${S.idx+1} / ${S.queue.length} · ${esc(S.title)}</span>${zbar()}</div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card"><span class="tag">${PARTS[it.part]}</span> <span class="note">· ${esc(it.label)}</span>`;
  if(it.showVerse)h+=`<div class="verse">${esc(it.verse)}</div>`;
  if(it.type==='z'){
    let n=0;
    const q=esc(it.cloze).replace(/\{\{(.+?)\}\}/g,()=>{n++;return `<span class="blank">&nbsp;<sup>${n}</sup>&nbsp;&nbsp;&nbsp;&nbsp;</span>`});
    h+=`<p class="q">${q}</p><textarea id="inp" oninput="S.dr[S.queue[S.idx].id]=this.value" placeholder="Fill the blanks in order: 1, 2, 3…">${esc(S.dr[it.id]||'')}</textarea>`;
    if(S.revealed)h+=`<div class="ans"><div class="lbl">Answer</div>${esc(it.cloze).replace(/\{\{(.+?)\}\}/g,'<mark>$1</mark>')}</div>`;
  }else{
    h+=`<p class="q">${esc(it.q)}</p><textarea id="inp" oninput="S.dr[S.queue[S.idx].id]=this.value" placeholder="${it.type==='f'?'What does it mean?':'Type or dictate your answer'}">${esc(S.dr[it.id]||'')}</textarea>`;
    if(S.revealed)h+=`<div class="ans"><div class="lbl">${it.alab||'Model answer'}</div>${fmt(it.ans)}</div>`;
  }
  h+=`</div>`;
  if(!S.revealed)h+=`<button class="pri" style="width:100%" onclick="reveal()">Reveal answer</button>`;
  else h+=`<div class="row grade"><button class="g-miss" onclick="grade(0)">Missed</button><button class="g-part" onclick="grade(1)">Partly</button><button class="g-got" onclick="grade(2)">Got it</button></div>`;
  h+=`<div class="row" style="margin-top:10px"><button class="ghost flex" onclick="back()" ${S.idx?'':'disabled'}>‹ Back</button>${S.revealed?`<button class="ghost flex" onclick="setRev(false)">Hide answer</button>`:''}<button class="ghost flex" onclick="skip()">Skip ›</button></div>`;
  return h;
}
function done(){
  const c={2:0,1:0,0:0};let sk=0;S.session.forEach(i=>{if(G[i.id]===undefined)sk++;else c[G[i.id]]++});
  const mi=S.session.filter(i=>G[i.id]!==2);
  return `<h1>Done</h1><p class="sub">${esc(S.title)}</p>
  <div class="stats"><div class="stat"><b style="color:var(--good)">${c[2]}</b><span>got it</span></div><div class="stat"><b style="color:var(--part)">${c[1]}</b><span>partly</span></div><div class="stat"><b style="color:var(--bad)">${c[0]}</b><span>missed</span></div>${sk?`<div class="stat"><b>${sk}</b><span>skipped</span></div>`:''}</div>
  <div class="row">${S.next?`<button class="pri flex" onclick="pickGo(S.next)">Next 20</button>`:''}${mi.length?`<button class="${S.next?'':'pri '}flex" onclick="retry()">Retry these ${mi.length}</button>`:''}<button class="flex" onclick="back2()">Back</button></div>`;
}
function go(s){S.screen=s;render()}
function openSec(id){S.sec=id;go('section')}
function openText(sc){S.txt=sc;go('text')}
function back2(){S.screen=S.from||'home';render()}
function begin(list,title){
  if(!list.length)return;
  if(S.screen==='pick')S.from=S.pickFrom;
  else if(S.screen!=='quiz'&&S.screen!=='done')S.from=S.screen;
  S.queue=list;S.session=list;S.idx=0;S.revealed=false;S.title=title;S.screen='quiz';render();
}
function retry(){begin(shuffle(S.session.filter(i=>G[i.id]!==2)),'Retry')}
function setRev(v){const el=$('#inp');const val=el?el.value:'';S.revealed=v;render(true);const t=$('#inp');if(t)t.value=val}
function reveal(){setRev(true)}
const DAYS=[0,1,3,7,14,30];
function isDue(i){const g=G[i.id];if(g===undefined)return false;const d=D[i.id];if(!d)return g<2;return Date.now()>=d.t+DAYS[d.b]*864e5}
function grade(g){const id=S.queue[S.idx].id;G[id]=g;const pb=D[id]?D[id].b:0;D[id]={t:Date.now(),b:g===2?Math.min(pb+1,5):g===1?1:0};delete S.dr[id];save();S.idx++;S.revealed=false;if(S.idx>=S.queue.length)S.screen='done';render()}
function skip(){S.idx++;S.revealed=false;if(S.idx>=S.queue.length)S.screen='done';render()}
function back(){if(S.idx>0){S.idx--;S.revealed=false;render()}}
render();
initRemote();
</script>
</body>
