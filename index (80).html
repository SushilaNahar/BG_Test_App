<title>Gītā Chapter 13 Self-Test</title>
<style>
:root{
  --bg:#faf6ee;--card:#fffdf8;--ink:#2b2320;--mute:#7a6d63;--line:#e6dccb;
  --acc:#b5541c;--acc-ink:#fff;--good:#2f7d4f;--part:#c98a1a;--bad:#b3392f;--soft:#f3ead8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1a1613;--card:#241e1a;--ink:#f0e8dc;--mute:#a4978b;--line:#3a312a;--acc:#e07a3a;--acc-ink:#1a1613;--good:#5fb883;--part:#e0a93a;--bad:#e2685d;--soft:#2e2620}
}
:root[data-theme="dark"]{--bg:#1a1613;--card:#241e1a;--ink:#f0e8dc;--mute:#a4978b;--line:#3a312a;--acc:#e07a3a;--acc-ink:#1a1613;--good:#5fb883;--part:#e0a93a;--bad:#e2685d;--soft:#2e2620}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font:600 24px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:600 19px/1.3 Georgia,serif;margin:0 0 6px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;min-height:44px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.ghost{background:transparent}
button.flex{flex:1}
button:disabled{opacity:.45}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mute)}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.unit .t{flex:1;min-width:0}
.unit .t small{display:block;color:var(--mute);font-size:12px}
.unit .t div{font-weight:600}
.dots{display:flex;gap:2px;flex-wrap:wrap;max-width:64px;justify-content:flex-end}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.g2{background:var(--good)}.dot.g1{background:var(--part)}.dot.g0{background:var(--bad)}
.verse{font:italic 17px/1.55 Georgia,serif;white-space:pre-line;color:var(--ink);background:var(--soft);border-radius:12px;padding:12px 14px;margin:8px 0}
.tag{display:inline-block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
.q{font-size:18px;line-height:1.45;margin:8px 0 12px}
textarea{width:100%;min-height:96px;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);resize:vertical}
.ans{background:var(--soft);border-left:4px solid var(--acc);border-radius:8px;padding:12px;margin:12px 0}
.ans .lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
mark{background:transparent;color:var(--acc);font-weight:700;border-bottom:2px solid var(--acc)}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--mute);margin:0 2px}
.grade button{flex:1;font-weight:600}
.g-got{border-color:var(--good);color:var(--good)}
.g-part{border-color:var(--part);color:var(--part)}
.g-miss{border-color:var(--bad);color:var(--bad)}
details{margin:8px 0}summary{cursor:pointer;color:var(--mute);font-size:14px;padding:6px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:none;color:var(--acc);padding:8px 0;min-height:44px;font-weight:600}
.note{font-size:13px;color:var(--mute)}
.sec{display:block;width:100%;text-align:left;margin:10px 0;padding:14px}
.sec .r{font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.04em}
.sec .tt{font-weight:600;margin:2px 0 8px}
.pb{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.pb i{display:block;height:100%}
.gistbox{background:var(--soft);border-radius:12px;padding:12px;margin:8px 0;font-size:15px}
.ans{white-space:pre-line}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.seg button{flex:1;border:none;border-radius:0;background:var(--card);font-weight:600;padding:10px 8px}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.hook{background:var(--soft);color:var(--acc);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 12px;font-weight:600}
.pt{display:flex;gap:10px;margin:0 0 10px;font-size:15px;line-height:1.55}
.pt .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--soft);color:var(--mute);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--acc);font-weight:600}
.ln{margin:0 0 10px}.ln .sk{font:italic 15px/1.5 Georgia,serif;color:var(--mute)}.ln .en{font-size:15px;line-height:1.5;border-left:3px solid var(--acc);padding-left:8px;margin-top:2px}
.chap{display:flex;align-items:center;width:100%;text-align:left;margin:12px 0;padding:16px}
.chap .cm{flex:1;min-width:0}.chap .r{font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.06em}
.sk2{font:italic 16px/1.4 Georgia,serif;color:var(--mute);margin:4px 0 2px}
.en2{font:600 18px/1.3 Georgia,serif;margin:0 0 6px}.chap .v{font-size:13px;color:var(--mute)}
.chev{font-size:28px;color:var(--mute);padding-left:8px}
.q{white-space:pre-line}
input[type=search]{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);margin:0 0 8px}
.lb2{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.src{display:inline-block;font-size:12px;border-radius:8px;padding:2px 8px;margin:0 0 6px;background:var(--soft);color:var(--good);font-weight:600}
:root{--lv-ch:#c2571a;--lv-sec:#1d5fd0;--lv-vs:#d0336f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lv-ch:#ff9a5c;--lv-sec:#6ea8ff;--lv-vs:#ff7eb0}}
:root[data-theme="dark"]{--lv-ch:#ff9a5c;--lv-sec:#6ea8ff;--lv-vs:#ff7eb0}
.lv-ch{--lv:var(--lv-ch)}.lv-sec{--lv:var(--lv-sec)}.lv-vs{--lv:var(--lv-vs)}
.tag,.sec .r,.chap .r{background:var(--lv,var(--acc));color:var(--acc-ink);border-radius:8px;padding:2px 8px;display:inline-block}
.unit.lvbar .t small{background:var(--lv);color:var(--acc-ink);border-radius:8px;padding:1px 8px;display:inline-block;margin-bottom:3px}
.lvbar{border-left:6px solid var(--lv,var(--acc))!important}
button.pri{background:var(--lv,var(--acc));border-color:var(--lv,var(--acc))}
.verse,.gistbox{border-left:4px solid var(--lv,var(--line));border-radius:4px 12px 12px 4px}
.dcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lv,var(--acc));border-radius:4px 14px 14px 4px;padding:2px 14px;margin:8px 0}
.dcard summary{color:var(--ink);font-weight:600;font-size:16px;padding:12px 0}
.dcard .card{border:none;background:none;padding:0;margin:0 0 10px}
.dcard .gistbox{border-left:none;background:var(--soft)}
.hook{color:var(--lv,var(--acc))}
.tb{background:transparent;border:1px solid var(--line);border-radius:18px;padding:4px 12px;min-height:36px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.pill{background:var(--lv);color:var(--acc-ink);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;display:inline-block}
</style>

<script>
const DATA={"chapters": [{"num": "13", "name": "Nature, the Enjoyer, and Consciousness", "prefix": "", "deep": ["S3:2", "S3:3", "S5:2"], "chapterQ": [["Chapters 6–12 concluded bhakti-yoga and 13–18 describe jñāna-yoga. Why does jñāna come after bhakti?", "In 12.7 Krishna promised to save His devotees from the path of birth and death. Chapters 13–18 fulfill that promise by supplying the philosophical knowledge needed to extricate oneself from material entanglement."], ["In what sense is the entire Gītā bhakti? What does each “six” do?", "First six: how to achieve bhakti through works (karma-yoga). Middle six: bhakti itself. Last six: how to achieve bhakti through knowledge. Knowledge used to attain devotion becomes part of bhakti."], ["Why does bhakti sit in the middle of the Gītā?", "Without the touch of bhakti both karma and jñāna are useless. In the middle, bhakti stays in contact with both and lends them value."], ["Name the five sections of Chapter 13 with their verse ranges.", "I (13.1–13.7) six questions; field and knower. II (13.8–13.12) process of knowledge and liberation. III (13.13–13.19) object of knowledge. IV (13.20–13.26) prakṛti, puruṣa and their union. V (13.27–13.35) jñāna-cakṣu, the vision of knowledge."], ["Which of Arjuna’s six questions does each section address?", "Section I (13.2–13.7): the 3rd, 4th and 5th (kṣetra, kṣetrajña, and the definition of jñāna). Section II: the 5th (process of knowledge). Section III: the 6th (jñeya). Section IV: the 1st and 2nd (prakṛti, puruṣa)."]], "sections": [{"id": "S1", "num": 1, "range": "13.1 – 13.7", "title": "Arjuna's six questions; the field and the knower", "gist": "Arjuna asks six questions. Krishna explains the field of activities as the body, the soul as knower of his own field, and Krishna as Supersoul, the knower of all fields. Knowledge is to know the field and its knowers.", "app": "Understanding reality means knowing matter, the spirit soul and the Supreme Lord in their proper perspective.", "q": [["What do Texts 13.2–13.7 establish?", "The body is the field; the soul is the knower of his own field; Krishna as Supersoul is the knower of all fields; knowledge is to know the field and its knowers."], ["Three things one must know to understand reality (Section I application)?", "Matter, the spirit soul and the Supreme Lord, each in their proper perspective."], ["Match the verse to the theme: 13.1, 13.2, 13.3, 13.4, 13.5, 13.6, 13.7.", "13.1 Arjuna’s six questions. 13.2 field and knower (3rd & 4th questions). 13.3 second knower and definition of knowledge. 13.4 five points about the field. 13.5 authorities. 13.6 what the field consists of. 13.7 transformations and interactions."]], "fl": [], "texts": [{"n": 1, "nl": "13.1", "label": "Text 13.1", "title": "Arjuna's six questions", "gist": "Arjuna asks six questions, on: (1) prakṛti, material nature; (2) puruṣa, the enjoyer of matter; (3) kṣetra, the field in which one acts within the material world; (4) kṣetrajña, the entity who experiences the field; (5) jñāna, knowledge and the process of acquiring it; (6) jñeya, the object of knowledge.", "focus": [["Which of the six questions does Krishna begin answering in 13.2?", "The third and fourth: the kṣetra and the kṣetrajña."]], "fc": [["Six questions in order", "Prakṛti, puruṣa, kṣetra, kṣetrajña, jñāna, jñeya."], ["jñeya", "The object of knowledge."]], "cz": ["I wish to know about {{prakṛti}} [nature], {{Puruṣa}} [the enjoyer], and the {{field}} and the {{knower of the field}}, and of {{knowledge}} and the end of knowledge."], "ap": [["Which of Arjuna's six questions do you feel most drawn to, and why?", "Open-ended. Example: kṣetrajña, because I want to understand who is actually experiencing my life."]], "ex": "Arjuna asks Krishna to explain six things: nature, the enjoyer, the field, the knower of the field, knowledge, and the object of knowledge. The rest of the chapter answers them.", "verse": "arjuna uvāca\nprakṛtiṁ puruṣaṁ caiva\nkṣetraṁ kṣetra-jñam eva ca\netad veditum icchāmi\njñānaṁ jñeyaṁ ca keśava", "tr": "Arjuna said: O my dear Kṛṣṇa, I wish to know about prakṛti [nature], Puruṣa [the enjoyer], and the field and the knower of the field, and of knowledge and the end of knowledge.", "trlabel": "Translation (from your PDF)", "lt": ["Arjuna said", "Nature (prakṛti) and the enjoyer (puruṣa)", "the field and the knower of the field", "I wish to understand this", "knowledge and the object of knowledge, O Keśava"]}, {"n": 2, "nl": "13.2", "label": "Text 13.2", "title": "Krishna answers: the field and the knower", "gist": "Krishna answers the third and fourth questions. This body is called the field (kṣetra). One who knows this body is called the knower of the field (kṣetrajña).", "focus": [["Purport (a): For whom is the body a field of activity, why does he get it, and how is the body decided?", "For the conditioned soul, who is entrapped in material existence by trying to lord it over nature. He gets a body according to his capacity to dominate material energy and to enjoy sense gratification."], ["Purport (b): How can you understand that you differ from the body?", "The body changes from childhood to old age, yet you remain the same person (Bg. 2.13, dehino ’smin). Intuitively, we use many articles but are different from them; “I am happy, I am a man” are bodily designations of the knower."], ["Purport (c): How does Prabhupāda describe the three sixes of the Gītā?", "First six: the knower of the body and how he can understand the Lord. Middle six: the Supreme Personality of Godhead, His superior position and the soul's subordinate position, and four kinds of pious men who approach Him. Last six: how the living entity contacts material nature and is delivered by the Lord through different methods."]], "fc": [["kṣetra", "The field; the body, understood as the field of activity for the conditioned soul."], ["kṣetrajña", "The knower of the field: the one who does not identify himself with the body."], ["prakṛti and puruṣa", "Prakṛti is material nature; puruṣa is the enjoyer, the living entity."]], "cz": ["This body, O son of Kuntī, is called the {{field}}, and one who {{knows}} this body is called the {{knower of the field}}."], "ap": [["What everyday observation shows that you are not the body? (Purport)", "From childhood to old age the body keeps changing, yet you remain one and the same person. Likewise we use clothes and other things but know we are different from them."]], "ex": "The body is like a field where the soul acts and experiences. The one who is aware of the body, the owner, is the knower of the field. So I am the knower, not the body.", "verse": "śrī-bhagavān uvāca\nidaṁ śarīraṁ kaunteya\nkṣetram ity abhidhīyate\netad yo vetti taṁ prāhuḥ\nkṣetra-jña iti tad-vidaḥ", "tr": "The Blessed Lord then said: This body, O son of Kuntī, is called the field, and one who knows this body is called the knower of the field.", "trlabel": "Translation (from your PDF)", "lt": ["The Blessed Lord said", "This body, O son of Kuntī", "is called the field", "one who knows this body they call", "the knower of the field, those who know this say"]}, {"n": 3, "nl": "13.3", "label": "Text 13.3", "title": "The second knower; definition of knowledge", "gist": "There is a second knower who knows all fields: the Supersoul. Knowledge (answering the fifth question) means understanding the body and its knowers, the soul and the Supersoul.", "focus": [["Purport (a)-(b): How do the two knowers differ, and what analogies are given?", "The soul is the individual knower of one body; the Supersoul is the superknower and proprietor of all bodies (citizen and king). The Lord is Hṛṣīkeśa, original controller of the senses; the soul is a secondary controller. One is fallible, the other infallible; one subordinate, the other superior."], ["Purport (d): How does the notes refute “soul and Supersoul are the same”?", "The word “ca” indicates the total number of bodies: Krishna is present as Supersoul in every body while the atomic soul is in only its own. Do not mistake a rope for a serpent. Real knowledge is knowing the Supersoul as controller of both the field and the finite enjoyers."], ["Purport (e): What are the three Brahman conceptions?", "Prakṛti is Brahman as the field of activities; the jīva is also Brahman, trying to control nature; the controller of both is also Brahman. Do not confuse painter, painting and easel."]], "fc": [["sarva-kṣetreṣu", "In all bodily fields, in all bodies."], ["Paramātmā (Supersoul)", "The superknower, the Lord present in every body beside the individual soul."], ["jñānam (per this verse)", "To understand the body and its owner; that is knowledge in Kṛṣṇa’s opinion."]], "cz": ["you should understand that I am also the {{knower}} in {{all bodies}}, and to understand this body and its owner is called {{knowledge}}."], "ap": [["Which three things must not be confused, and what image does the purport use? (Purport)", "Nature (the field of activities), the living entity (the enjoyer of nature) and the Supreme controller, the Personality of Godhead. Do not confuse the painter, the painting and the easel."]], "ex": "Two knowers live in every body: the individual soul who knows only his own body, and the Lord as Supersoul who knows all bodies. Real knowledge is understanding the body, the soul and the Supersoul.", "verse": "kṣetra-jñaṁ cāpi māṁ viddhi\nsarva-kṣetreṣu bhārata\nkṣetra-kṣetrajñayor jñānaṁ\nyat taj jñānaṁ mataṁ mama", "tr": "O scion of Bharata, you should understand that I am also the knower in all bodies, and to understand this body and its owner is called knowledge. That is My opinion.", "trlabel": "Translation (from your PDF)", "lt": ["Know Me also as the knower of the field", "in all bodies, O Bharata", "understanding the field and its knower", "that is knowledge, in My opinion"]}, {"n": 4, "nl": "13.4", "label": "Text 13.4", "title": "Five points about the field", "gist": "Krishna proposes to explain five points about the kṣetra: how the body is constituted, what changes it undergoes, how, when and where it is produced, who the knower is, and the knower's influence.", "focus": [["Where in the chapter is each of the five points explained?", "1. Constitution: 13.6–13.7. 2. Changes: 13.7 and 13.20. 3. Production: 13.6, 13.21, 13.22, 13.30. 4. Identity of the knower: 13.14–13.18 and 13.23. 5. Influence of the knower: 13.14–13.18."], ["Purport: What is the best way to solve these issues, and what is the caution?", "Understand the Gītā as described by the Supreme Personality of Godhead. Caution: do not consider the Supreme Personality in every body to be one with the individual soul; that would be like equating the potent and the impotent."]], "fc": [["samāsena", "Briefly, in summary."], ["vikāri", "Its changes or transformations."], ["yat-prabhāvaḥ", "What his (the knower’s) influences or powers are."]], "cz": ["Now please hear My {{brief}} description of this field of activity and how it is {{constituted}}, what its {{changes}} are, whence it is {{produced}}."], "ap": [["Think of your own life: which of these questions (what is my field, how does it change, where did it come from, who am I) do you rarely ask? Pick one and note a first answer.", "Open-ended. Example: “How does my field change?” My mood, energy and body shift daily, yet something in me notices all of it."]], "ex": "Kṛṣṇa says He will briefly explain what the body-field is, how it changes, where it comes from, and who the knower of it is and what his power is.", "verse": "tat kṣetraṁ yac ca yādṛk ca\nyad-vikāri yataś ca yat\nsa ca yo yat-prabhāvaś ca\ntat samāsena me śṛṇu", "tr": "Now please hear My brief description of this field of activity and how it is constituted, what its changes are, whence it is produced, who that knower of the field of activities is, and what his influences are.", "trlabel": "Translation (from your PDF)", "lt": ["That field, what it is and how it is constituted", "what its changes are and whence it is produced", "and who the knower is and what his influences are", "hear that briefly from Me"]}, {"n": 5, "nl": "13.5", "label": "Text 13.5", "title": "Authorities cited", "gist": "Krishna cites the authorities: He summarizes philosophical conclusions of great sages, especially Vyāsadeva's Vedānta-sūtra.", "focus": [["Purport (a): Why does Krishna, the highest authority, cite authorities?", "Learned scholars and standard authorities always give evidence from past authorities. Krishna does so too. Vyāsa explains duality in the Vedānta-sūtra, and his father Parāśara also writes of it, saying that all are transcendental but fallen into the three modes by karma, due to ignorance, while the Supersoul is infallible."], ["Purport (b): Name the five stages of Brahman realization (Taittirīya Upaniṣad 2.9).", "Annamaya (food as the object of realization), Prāṇamaya (life symptoms), Jñānamaya (thinking, feeling, willing), Vijñānamaya (the soul distinguished from mind and life symptoms; the soul itself becomes the object), Ānandamaya (the all-blissful; realizing self versus Supreme Self and entering a loving relationship)."], ["Purport (c): Which stages belong to the kṣetra and which to the kṣetrajña?", "Kṣetra: gross body (annamaya and prāṇamaya) and subtle body (jñānamaya). Kṣetrajña: individual soul (vijñānamaya) and Supreme Soul (ānandamaya)."], ["Purport (d)-(e): What is the perfection of the living entity, and what should be sought in the Vedānta-sūtra?", "Perfection is dovetailing oneself with the Ānandamaya, enjoying with the Lord. The Vedānta-sūtra shows the Lord as Supreme Knower, the living entity as subordinate knower, and nature as the field."]], "fc": [["ṛṣi", "Sage."], ["brahma-sūtra (Vedānta-sūtra)", "The aphorisms of Vyāsadeva that carefully present this knowledge."], ["hetumadbhiḥ viniścitaiḥ", "With reasoning on cause and effect, settled conclusions."]], "cz": ["That knowledge ... is described by various {{sages}} in various Vedic writings, especially in the {{Vedānta-sūtra}}, and is presented with all {{reasoning}} as to cause and effect."], "ap": [["When you learn a spiritual idea, how do you check it against authority and reasoning? Give one concrete habit.", "Example: compare the idea with a verse and a trusted commentary rather than relying only on my own impression, and ask whether the reasoning holds."]], "ex": "Kṛṣṇa says this isn’t new or personal opinion. Sages have taught it in scripture, especially the Vedānta-sūtra, with logical reasons behind it.", "verse": "ṛṣibhir bahudhā gītaṁ\nchandobhir vividhaiḥ pṛthak\nbrahma-sūtra-padaiś caiva\nhetumadbhir viniścitaiḥ", "tr": "That knowledge of the field of activities and of the knower of activities is described by various sages in various Vedic writings—especially in the Vedānta-sūtra—and is presented with all reasoning as to cause and effect.", "trlabel": "Translation (from your PDF)", "lt": ["Sung by the sages in many ways", "in various Vedic hymns, separately", "and in the aphorisms of the Vedānta-sūtra", "with reasoning and settled conclusions"]}, {"n": 6, "nl": "13.6", "label": "Text 13.6", "title": "What the field consists of", "gist": "This verse and the next show that the field or body is a nonpermanent material thing and the kṣetrajña is different from it. Text 13.6 explains what the field consists of.", "focus": [["Purport (a): List the twenty-four components of the field.", "Five great elements; five sense objects; eleven senses including the mind; intelligence and false ego; and the unmanifested stage of the three modes, called pradhāna."], ["Purport (e): How does the purport explain pradhāna?", "The five great elements are a gross representation of false ego, which represents the primal stage called tamasa buddhi (intelligence in ignorance), which represents the unmanifested three modes, called pradhāna."]], "fc": [["mahā-bhūta", "The five great elements: earth, water, fire, air, ether."], ["ahaṅkāra / buddhi / avyakta", "False ego / intelligence / the unmanifested stage of the modes of nature."], ["indriya-gocara", "The five sense objects."]], "cz": ["The five great elements, false ego, {{intelligence}}, the unmanifested, the {{ten senses}}, the {{mind}}, and the {{five sense objects}} ... are considered, in summary, to be the {{field of activities}} and its interactions."], "ap": [["Take a recent moment of anger or craving. Which items on this list were involved (desire, hatred, mind, senses, ego)?", "Example: an insult (sound, a sense object) reached my mind, my false ego felt hurt, and hatred (dveṣa) arose. All of these belong to the field, the one who observes them is the knower."]], "ex": "Kṛṣṇa lists everything that makes up the field: the elements, ego, intelligence, senses, mind, sense objects, and also feelings like desire, hatred, pleasure and pain. Together, that is the body-field and how it works.", "verse": "mahā-bhūtāny ahaṁkāro\nbuddhir avyaktam eva ca\nindriyāṇi daśaikaṁ ca\npañca cendriya-gocarāḥ", "tr": "The five great elements, false ego, intelligence, the unmanifested, the ten senses, the mind, the five sense objects, desire, hatred, happiness, distress, the aggregate, the life symptoms, and convictions—all these are considered, in summary, to be the field of activities and its interactions.", "trlabel": "Translation (from your PDF)", "lt": ["The great elements, false ego", "intelligence, and the unmanifested", "the ten senses and the one (mind)", "and the five sense objects"]}, {"n": 7, "nl": "13.7", "label": "Text 13.7", "title": "Transformations and interactions", "gist": "Text 13.7 explains the transformations and interactions of the field.", "focus": [["Purport (b)-(c): What are the interactions of the gross body and of the subtle body?", "Gross body: desire, hatred, happiness, distress. Subtle body: the living symptoms, represented by consciousness, and convictions."], ["Purport (f): What are the six changes of the body (vikāras)?", "It takes birth, grows, stays, produces by-products, decays and dies."]], "fc": [["cetanā and dhṛti", "Life symptoms and convictions."]], "cz": ["desire, {{hatred}}, happiness, {{distress}}, the {{aggregate}}, the life symptoms, and convictions"], "ap": [["Name a recent moment when desire or hatred arose in you. Was it in the gross or the subtle body, and who noticed it?", "Example: irritation at delay is an interaction of the body-mind field (hatred), and the one who notices it is the knower."]], "ex": "The field includes desire, hatred, happiness and distress in the gross body, and consciousness and convictions in the subtle body. The body also goes through six changes, from birth to death.", "verse": "icchā dveṣaḥ sukhaṁ duḥkhaṁ\nsaṁghātaś cetanā dhṛtiḥ\netat kṣetraṁ samāsena\nsa-vikāram udāhṛtam", "tr": "The five great elements, false ego, intelligence, the unmanifested, the ten senses, the mind, the five sense objects, desire, hatred, happiness, distress, the aggregate, the life symptoms, and convictions—all these are considered, in summary, to be the field of activities and its interactions.", "trlabel": "Translation (from your PDF)", "lt": ["Desire, hatred, happiness, distress", "the aggregate, life symptoms, convictions", "this is the field, in summary", "together with its interactions, declared"]}], "why": ["Arjuna asks six questions (prakṛti, puruṣa, kṣetra, kṣetrajña, jñāna, jñeya). Krishna begins to answer: the body is the field, the soul is the knower of his own field, Krishna as Supersoul is the knower of all fields, and knowledge is to know the field and its knowers.", "notes"], "from": {"prev": "Chapter 12", "t": "In 12.7 Krishna promised to save His devotees from the path of birth and death. Chapters 13 to 18 fulfill that promise by giving the philosophical knowledge needed to get out of material entanglement.", "src": "notes"}, "one": "Six questions; the body is the field, the soul and the Supersoul are its knowers.", "nxt": "So how does the knower get free of the body?"}, {"id": "S2", "num": 2, "range": "13.8 – 13.12", "title": "The process of knowledge and liberation", "gist": "Krishna explains the process of knowledge: activities and qualities by which a soul gets knowledge beyond the limits of his field of activities and so transcends it. Link from Section I: how the kṣetrajña can disentangle from the body by cultivating jñāna.", "app": "The Lord reveals true knowledge to the hearts of deserving persons, so the real method of acquiring knowledge is cultivating saintly character, headed by humility.", "q": [["What is the link between Section I and Section II?", "Now Krishna explains how the kṣetrajña can disentangle himself from the body by cultivating jñāna."], ["What is the common theme of 13.8–13.12, and its practical application?", "Cultivating these twenty qualities is the real method of acquiring knowledge. Since the Lord reveals true knowledge to the hearts of deserving persons, cultivate saintly character, headed by humility."], ["Which verse holds the most important quality, and which items sit in each verse?", "13.11 (unalloyed devotion). Items: 13.8 items 1–9; 13.9 items 10–12; 13.10 items 13–15; 13.11 items 16–18; 13.12 items 19–20."]], "fl": [["Item 1: Humility", "Not being anxious to be honored by others."], ["Item 2: Pridelessness", "Not being anxious to be famous for one’s religion, or joining a group without following principles and advertising as a religious mentor."], ["Item 3: Non-violence", "Not putting others into distress; distribute real knowledge, since without elevating them one is practicing violence."], ["Item 4: Tolerance", "Practice bearing insult and dishonor, e.g. Prahlāda Mahārāja."], ["Item 5: Simplicity", "So straightforward you can disclose the real truth even to an enemy."], ["Item 6: Accepting a spiritual master", "Approach with humility and offer all services; his blessings make following the principles easier."], ["Item 7: Cleanliness", "Bathing (external) and chanting (internal)."], ["Item 8: Steadiness", "Determination to make progress in spiritual life."], ["Item 9: Self-control", "Reject anything unfavorable to spiritual advancement."], ["Item 10: Renunciation of sense objects", "Don’t cater to unnecessary demands; cater only to keep the body fit for devotional service."], ["Item 11: Absence of false ego", "Reject “I am this body, mind”; accept “I am a servant of Krishna.”"], ["Item 12: Perception of evils of birth, death, disease, old age", "Regularly hear about these topics from the proper source."], ["Item 13: Detachment", "Be ready to sacrifice everything for Krishna."], ["Item 14: No entanglement with wife, children, etc.", "Affection is natural; renounce it if unfavorable to spiritual advancement, e.g. Arjuna."], ["Item 15: Even-mindedness", "Not elated or distressed at material gain or loss; possible through unbreakable devotional service."], ["Item 16: Unalloyed devotional service", "Engage in the nine processes of bhakti (ananya-bhakti)."], ["Items 17–18: Solitary place; detachment from the masses", "Not mixing with materialistic men; living in the association of devotees."], ["Item 19: Importance of self-realization", "Give up unnecessary sports, cinema, social activities and other wastage of time."], ["Item 20: Philosophical search for the Absolute Truth", "Reject useless research on topics like sex life; research the nature of the soul by discretion."]], "texts": [{"n": 8, "nl": "13.8", "label": "Text 13.8", "title": "Qualities 1–9 (verse 13.8)", "gist": "Verse 13.8 lists the first nine of the twenty items of knowledge: humility, pridelessness, non-violence, tolerance, simplicity, approaching a spiritual master, cleanliness, steadiness, self-control.", "focus": [["Purport (a): Why do less intelligent people misread this process, and why is it not part of the field?", "Acquiring knowledge involves proper bodily and mental behavior, so it may wrongly be counted as part of the field. But these actions liberate the jīva from the body, so they are not part and parcel of bodily activity."], ["Purport (h): Why is humility the beginning of knowledge?", "One must be convinced “I am subordinate.” Anyone who wants to compete with God and still advance will be frustrated."], ["How does the notes define humility, pridelessness and non-violence?", "Humility: not anxious to be honored by others. Pridelessness: not anxious to be famous for one’s religion or to advertise as a religious mentor. Non-violence: not putting others into distress, and distributing real knowledge."]], "fc": [["Tolerance (notes)", "Bearing insult and dishonor from others, e.g. Prahlāda Mahārāja."], ["Simplicity (notes)", "So straightforward you can disclose the real truth even to an enemy, without diplomacy."], ["Cleanliness (notes)", "Bathing (external) and chanting (internal)."], ["Accepting a spiritual master (notes)", "Approach with humility and offer all services; his blessings make it easier to follow the principles and advance immediately."]], "cz": ["{{Humility}}, {{pridelessness}}, {{nonviolence}}, {{tolerance}}, {{simplicity}}, approaching a bona fide {{spiritual master}}, cleanliness, steadiness and {{self-control}}"], "ap": [["Which of these nine qualities do you most want to strengthen this month? Give one action.", "Open-ended. Example: tolerance, staying quiet the next time someone criticizes me."]], "ex": "Verse 13.8 begins the list of qualities that make up real knowledge: humility, pridelessness, non-violence, tolerance, simplicity, approaching a guru, cleanliness, steadiness and self-control.", "verse": "amānitvam adambhitvam\nahiṁsā kṣāntir ārjavam\nācāryopāsanaṁ śaucaṁ\nsthairyam ātma-vinigrahaḥ", "tr": "Humility, pridelessness, nonviolence, tolerance, simplicity, approaching a bona fide spiritual master, cleanliness, steadiness and self-control. (Items 1–9 of 20.)", "trlabel": "Gist of this verse (your notes)", "lt": ["Humility, pridelessness", "nonviolence, tolerance, simplicity", "approaching a spiritual master, cleanliness", "steadiness, self-control"]}, {"n": 9, "nl": "13.9", "label": "Text 13.9", "title": "Qualities 10–12 (verse 13.9)", "gist": "Verse 13.9 gives items 10–12: renunciation of sense objects, absence of false ego, and perceiving the evils of birth, death, old age and disease.", "focus": [["Purport (f): Why discuss the miseries of material life?", "Unless we have a pessimistic view of material life, there is no impetus for spiritual advancement."], ["How does the notes define renunciation of sense objects, and how to control the senses?", "Do not cater to unnecessary demands; cater only to keep the body fit for devotional service. Control by systematic regulation, especially chanting Hare Krishna and prasādam."]], "fc": [["Absence of false ego (notes)", "Reject “I am this body, mind, etc.”; accept “I am a servant of Krishna.”"], ["Perception of evils of birth, death, disease, old age (notes)", "Must regularly hear about these topics from the proper source."]], "cz": ["{{Renunciation}} of the objects of sense gratification, absence of {{false ego}}, the perception of the {{evil}} of birth, death, old age and disease"], "ap": [["What is one unnecessary demand of your senses that you could decline this week?", "Open-ended. Example: scrolling late at night."]], "ex": "Verse 13.9 asks for detachment from sense objects, dropping the false identification with the body, and remembering the suffering built into birth, death, old age and disease so that we seek something higher.", "verse": "indriyārtheṣu vairāgyam\nanahaṁkāra eva ca\njanma-mṛtyu-jarā-vyādhi-\nduḥkha-doṣānudarśanam", "tr": "Renunciation of the objects of sense gratification, absence of false ego, and the perception of the evil of birth, death, old age and disease. (Items 10–12.)", "trlabel": "Gist of this verse (your notes)", "lt": ["Renunciation of the objects of sense gratification", "and absence of false ego", "birth, death, old age and disease", "perceiving the evil and distress in them"]}, {"n": 10, "nl": "13.10", "label": "Text 13.10", "title": "Qualities 13–15 (verse 13.10)", "gist": "Verse 13.10 gives items 13–15: detachment, no entanglement with wife, children and home, and even-mindedness.", "focus": [["How does the notes define detachment, non-entanglement, and even-mindedness?", "Detachment: be ready to sacrifice everything for Krishna. Non-entanglement: affection is natural, but renounce it if unfavorable to spiritual advancement, e.g. Arjuna was asked to renounce family connections. Even-mindedness: not elated or distressed at material gain or loss, possible through unbreakable devotional service."], ["Purport (g): What are the four things that make home life pleasant?", "Chant Hare Krishna, honor prasādam, discuss Bhagavad-gītā and Śrīmad-Bhāgavatam, and deity worship."]], "fc": [["Even-mindedness (notes)", "Not elated or distressed at material gain or loss."]], "cz": ["nonattachment to {{children, wife, home}} and the rest, and {{evenmindedness}} amid pleasant and unpleasant events"], "ap": [["Where do you lose your balance most easily, in praise or in blame?", "Open-ended."]], "ex": "Verse 13.10 asks for non-attachment to family and home, and steadiness in pleasant and unpleasant events. The notes say home life is best made pleasant through Krishna consciousness.", "verse": "asaktir anabhiṣvaṁgaḥ\nputra-dāra-gṛhādiṣu\nnityaṁ ca sama-cittatvam\niṣṭāniṣṭopapattiṣu", "tr": "nonattachment to children, wife, home and the rest, and evenmindedness amid pleasant and unpleasant events. (Items 13–15.)", "trlabel": "Gist of this verse (your notes)", "lt": ["Nonattachment, freedom from entanglement", "with children, wife, home and the rest", "and constant evenmindedness", "in desirable and undesirable events"]}, {"n": 11, "nl": "13.11", "label": "Text 13.11", "title": "Qualities 16–18 (verse 13.11): the most important", "gist": "Verse 13.11 gives items 16–18: unalloyed devotion, resorting to solitary places, and detachment from the general mass of people. Its first line (mayi cānanya-yogena) is the most important quality.", "focus": [["Purport (b): Which is the most important quality, and what follows if it is developed?", "Unalloyed devotional service (13.11). The process of knowledge terminates in it, and with full Kṛṣṇa consciousness the other qualities develop automatically (SB 5.18.12)."], ["Purport (c): Which quality is essential even for one who takes to devotional service?", "Accepting a spiritual master."], ["How does the notes define aspiring for a solitary place and detachment from the masses?", "Not desiring to mix with materialistic men; living in the association of devotees."]], "fc": [["Ananya-bhakti (notes)", "Unalloyed devotional service: engaging in the nine processes of bhakti."]], "cz": ["{{constant and unalloyed devotion}} to Me, resorting to {{solitary places}}, detachment from the general mass of people"], "ap": [["What one association in your life most supports your spiritual practice, and how could you spend more time there?", "Open-ended."]], "ex": "The heart of this list is unalloyed devotion to Krishna, along with living in the association of devotees and avoiding needless mixing with materialistic people. If devotion is present, the other qualities follow.", "verse": "mayi cānanya-yogena\nbhaktir avyabhicāriṇī\nvivikta-deśa-sevitvam\naratir jana-saṁsadi", "tr": "constant and unalloyed devotion to Me, resorting to solitary places, detachment from the general mass of people. (Items 16–18.)", "trlabel": "Gist of this verse (your notes)", "lt": ["In Me, with unalloyed devotion (yoga)", "steady, unswerving devotional service", "resorting to solitary places", "detachment from the general mass of people"]}, {"n": 12, "nl": "13.12", "label": "Text 13.12", "title": "Qualities 19–20; knowledge versus ignorance (verse 13.12)", "gist": "Verse 13.12 gives items 19–20: accepting the importance of self-realization and philosophical search for the Absolute Truth. All this is knowledge; the contrary is ignorance.", "focus": [["Purport (d)-(e): What is ignorance, and how do you test progress?", "Anything speculated beyond these items of knowledge is nonsense (ignorance). Test progress by qualities like humility and pridelessness."], ["How does the notes define items 19 and 20?", "19: Give up unnecessary sports, cinema, social activities and other wastage of time. 20: Reject useless philosophical research on topics like sex life; research the nature of the soul by discretion."]], "fc": [["Ajñāna", "Ignorance: whatever is contrary to the twenty items of knowledge."]], "cz": ["... all these I thus declare to be {{knowledge}}, and what is contrary to these is {{ignorance}}."], "ap": [["Which time-wasting activity would you drop to give more time to self-realization?", "Open-ended."]], "ex": "Verse 13.12 completes the twenty items: value self-realization and search for the Absolute Truth. Everything on the list is knowledge; everything opposite is ignorance.", "verse": "adhyātma-jñāna-nityatvaṁ\ntattva-jñānārtha-darśanam\netaj jñānam iti proktam\najñānaṁ yad ato ’nyathā", "tr": "all these I thus declare to be knowledge, and what is contrary to these is ignorance.", "trlabel": "Gist of this verse (your notes)", "lt": ["Constancy in self-realization", "philosophical search for the Absolute Truth", "all this is declared to be knowledge", "and what is contrary to it is ignorance"]}], "why": ["Krishna explains the process of knowledge: the activities and qualities by which a soul gets knowledge beyond the limits of his field of activities and so transcends it.", "notes"], "from": {"prev": "Section 1", "t": "Section 1 defined the field and its knowers. Now Krishna explains how the knower of the field can disentangle himself from the body by cultivating knowledge.", "src": "notes"}, "one": "The twenty qualities that make up knowledge.", "nxt": "And what is this knowledge meant to reveal?"}, {"id": "S3", "num": 3, "range": "13.13 – 13.19", "title": "The object of knowledge (jñeya)", "gist": "Krishna answers Arjuna's sixth question. The soul can know the Supersoul, the ultimate object of knowledge. Only devotees can fully understand the field, the process of knowledge, and both soul and Supersoul.", "app": "Know the Supersoul as all-pervading, transcendental, undivided, the source of all knowledge and situated in every heart.", "q": [["What is the theme of Section III?", "Jñeya: the soul and Supersoul are the real objects to be known. 13.13 describes the soul; 13.14–13.18 the Supersoul."], ["Match: 13.14, 13.15, 13.16, 13.17, 13.18, 13.19.", "13.14 all-pervading. 13.15 transcendental. 13.16 all-reconciling. 13.17 undivided. 13.18 source of all knowledge and enlightenment. 13.19 only devotees fully understand."], ["Summarized theme 13B: In which three roles is the Supersoul described?", "As the object of knowledge (jñeya, 13.14–13.18), as the knower of the field (kṣetrajña, 13.3: superknower, supreme proprietor and controller, infallible and superior), and as the puruṣa (13.23: transcendental enjoyer, overseer and permitter, maintainer and real friend)."], ["List characteristics of the Supersoul as jñeya (13B-A).", "All-pervading; source of senses yet without them; unattached though maintainer; transcendental to the modes though master of them; all-reconciling; subtle and beyond material senses; undivided though appearing divided; maintains, devours and develops all; source of knowledge and enlightenment; situated in the heart."], ["What is the link between 13.18 and 13.19?", "Krishna ends the explanation of the knowable by describing the qualification of the one able to understand these topics."]], "fl": [], "texts": [{"n": 13, "nl": "13.13", "label": "Text 13.13", "title": "The knowable: the soul", "gist": "Krishna begins answering the sixth question: the objects of knowledge are the soul and Supersoul. This verse describes the first, the soul (living entity). Benefit: one relishes the nectar of life.", "focus": [["Purport (a): In what sense is the living entity “knowable” and beginningless?", "Chapter 2 describes him as eternal; there is no record of a date of his manifestation, so he is anādi. Katha Upaniṣad: the knower of the body has no birth or death, and is full of knowledge."], ["Purport (c): Does 13.13 refer to Vijñāna Brahman or Ānanda Brahman?", "Vijñāna Brahman, the living entity. Ānanda Brahman is the Supreme Personality of Godhead."]], "fc": [["jñeya", "The knowable, the object of knowledge."], ["anādi", "Beginningless."], ["amṛta", "Nectar; the eternal."], ["mat-param brahma", "Brahman, subordinate to Me."]], "cz": ["I shall now explain the {{knowable}}, knowing which you will taste the {{eternal}}. This is {{beginningless}}, and it is subordinate to Me."], "ap": [["The purport says the living entity is eternally in service. How would recognizing that change how you hold your own ambitions?", "Example: my role becomes service rather than ownership, so I care less about lording it over results."]], "ex": "Kṛṣṇa now turns to what must be known. It has no beginning, is subordinate to Him, and knowing it gives a taste of eternal nectar.", "verse": "jñeyaṁ yat tat pravakṣyāmi\nyaj jñātvāmṛtam aśnute\nanādi mat-paraṁ brahma\nna sat tan nāsad ucyate", "tr": "I shall now explain the knowable, knowing which you will taste the eternal. This is beginningless, and it is subordinate to Me. It is called Brahman, the spirit, and it lies beyond the cause and effect of this material world.", "trlabel": "Translation (from your PDF)", "lt": ["I shall explain the knowable", "knowing which one tastes the eternal (nectar)", "beginningless Brahman, subordinate to Me", "it is called neither cause nor effect of this world"]}, {"n": 14, "nl": "13.14", "label": "Text 13.14", "title": "Supersoul is all-pervading", "gist": "Verses 13.14–13.18 describe the Supersoul as the object of knowledge. 13.14: the Supersoul is all-pervading, with hands, legs, eyes, ears and faces everywhere.", "focus": [["Purport: How does the purport prove this verse is about the Supersoul, not the individual soul?", "The individual soul cannot claim hands and legs everywhere. If someone says he will attain that when he gets knowledge, that is contradictory: a soul conditioned by matter is not supreme. The Supreme extends His hand without limit (Bg. 9.26, Brahma-saṁhitā 5.37)."]], "fc": [["sarvataḥ pāṇi-pādam", "Everywhere are His hands and legs."], ["sarvam āvṛtya tiṣṭhati", "He exists, pervading everything."]], "cz": ["Everywhere are His {{hands and legs}}, His {{eyes and faces}}, and He {{hears}} everything. In this way the Supersoul exists."], "ap": [["Where in the Gītā does the purport say the Lord accepts a small offering, and what does that show?", "Where the Lord says He accepts a flower, fruit or water offered with devotion. It shows His hands are actually present everywhere and receive what is offered."]], "ex": "The Supersoul is everywhere at once, like the sun spreading rays. He sees, hears and acts through everything, unlike the individual soul, who is limited to one body.", "verse": "sarvataḥ pāṇi-pādaṁ tat\nsarvato ’kṣi-śiro-mukham\nsarvataḥ śrutimal loke\nsarvam āvṛtya tiṣṭhati", "tr": "Everywhere are His hands and legs, His eyes and faces, and He hears everything. In this way the Supersoul exists.", "trlabel": "Translation (from your PDF)", "lt": ["Everywhere are His hands and legs", "everywhere His eyes, heads and faces", "everywhere He hears in the world", "He exists, pervading everything"]}, {"n": 15, "nl": "13.15", "label": "Text 13.15", "title": "Supersoul is transcendental", "gist": "The Supersoul is transcendental: source of all senses yet without material senses; unattached yet maintainer; beyond the modes yet their master.", "focus": [["Purport (a): Does the Lord have senses? (Śvetāśvatara 3.19; Bg. 7.26)", "Yes, transcendental ones. No materially contaminated hands, but spiritual hands that accept sacrifice; no material eyes, but spiritual eyes that see past, present and future; spiritual legs that travel through the universe. The Lord is not impersonal."], ["Purport (b)-(c): How does the Lord appear, and why can’t we see Him?", "By His internal potency, uncontaminated by matter (Bg. 4.6). We are materially contaminated, and only by transcendental elevation can one see His form."]], "fc": [["nirguṇa", "Without the material modes (guṇas)."], ["guṇa-bhoktṛ", "Master or enjoyer of the modes."], ["asakta", "Unattached."], ["sarva-bhṛt", "Maintainer of all."]], "cz": ["The Supersoul is the original source of all {{senses}}, yet He is without senses. He is {{unattached}}, although He is the {{maintainer}} of all living beings. He transcends the modes of nature, and at the same time He is the {{master}} of all modes of material nature."], "ap": [["What does the contrast between our covered senses and His uncovered senses suggest about the goal of spiritual practice?", "Our senses are spiritual in origin but covered by matter, so the goal is to free them from material covering and engage them in the Lord’s service."]], "ex": "The Lord is the source of all senses, but His senses are not material. He is unattached, yet maintains everything and controls the modes without being touched by them.", "verse": "sarvendriya-guṇābhāsaṁ\nsarvendriya-vivarjitam\nasaktaṁ sarva-bhṛc caiva\nnirguṇaṁ guṇa-bhoktṛ ca", "tr": "The Supersoul is the original source of all senses, yet He is without senses. He is unattached, although He is the maintainer of all living beings. He transcends the modes of nature, and at the same time He is the master of all modes of material nature.", "trlabel": "Translation (from your PDF)", "lt": ["He appears to have the qualities of all the senses", "yet He is without material senses", "unattached, yet the maintainer of all", "free from the modes, yet master of the modes"]}, {"n": 16, "nl": "13.16", "label": "Text 13.16", "title": "Supersoul is all-reconciling", "gist": "The Supersoul is all-reconciling: inside and outside, moving and nonmoving, far and near, and too subtle for material senses.", "focus": [["Purport: Why is the Lord called avijñeya, and how can He be understood?", "He is subtle, beyond the material senses. Only by purifying the senses through Kṛṣṇa consciousness (Bg. 11.54, Brahma-saṁhitā “premāñjana”), and by hearing with devotion from transcendental sources."]], "fc": [["bahir antaś ca", "Both outside and inside."], ["sūkṣmatvāt avijñeyam", "Not knowable by material senses due to subtlety."], ["dūra-stham cāntike ca", "Far away, yet near."]], "cz": ["He is beyond the power of the material {{senses}} to see or to know. Although {{far, far away}}, He is also {{near}} to all."], "ap": [["What could it mean in daily life that the Lord is “near” though “far”?", "Example: the Lord is present in my heart at every moment, yet distant to a mind full of distraction. Quieting the mind brings Him near."]], "ex": "God is both inside and outside everything and moves in the moving and unmoving. He is too subtle for material senses, far for the distracted and near for the devoted.", "verse": "bahir antaś ca bhūtānām\nacaraṁ caram eva ca\nsūkṣmatvāt tad avijñeyaṁ\ndūra-sthaṁ cāntike ca tat", "tr": "The Supreme Truth exists both internally and externally, in the moving and nonmoving. He is beyond the power of the material senses to see or to know. Although far, far away, He is also near to all.", "trlabel": "Translation (from your PDF)", "lt": ["Outside and inside of all beings", "the nonmoving and the moving", "because of subtlety He cannot be known by material senses", "far away, and yet near"]}, {"n": 17, "nl": "13.17", "label": "Text 13.17", "title": "Supersoul is undivided", "gist": "The Supersoul appears divided but is situated as one; He maintains all beings and also devours and develops them.", "focus": [["Purport (a)-(b): What examples and references are given?", "The sun at the meridian seems overhead to everyone 5,000 miles in every direction. “One Viṣṇu” is present everywhere by omnipotence. The Vedic hymns call Him origin and rest of all. “Devouring” refers to Chapter 11: “I have come to devour all in the form of time.”"]], "fc": [["avibhakta", "Undivided."], ["vibhaktam iva", "As if divided."], ["grasiṣṇu", "Devours."], ["prabhaviṣṇu", "Develops."]], "cz": ["Although the Supersoul appears to be {{divided}}, He is never divided. He is situated as {{one}}. Although He is the {{maintainer}} of every living entity, it is to be understood that He {{devours}} and {{develops}} all."], "ap": [["The Lord maintains, devours and develops. Which of these do you find hardest to accept, and why?", "Open-ended. Example: “devours”, because I prefer thinking of the Lord as only kind. The purport links it to His form as time in the Eleventh Chapter."]], "ex": "The Supersoul is one but appears in every heart, like the sun seen overhead by everyone. He sustains creatures, brings them forth at creation and withdraws them at annihilation.", "verse": "avibhaktaṁ ca bhūteṣu\nvibhaktam iva ca sthitam\nbhūta-bhartṛ ca taj jñeyaṁ\ngrasiṣṇu prabhaviṣṇu ca", "tr": "Although the Supersoul appears to be divided, He is never divided. He is situated as one. Although He is the maintainer of every living entity, it is to be understood that He devours and develops all.", "trlabel": "Translation (from your PDF)", "lt": ["Undivided among the living beings", "yet situated as if divided", "He is to be known as the maintainer of beings", "He devours and He develops all"]}, {"n": 18, "nl": "13.18", "label": "Text 13.18", "title": "Source of all knowledge and enlightenment", "gist": "He is the source of light in all luminous objects, beyond the darkness of matter, unmanifested, knowledge, the object of knowledge and its goal, and situated in everyone's heart. Here Krishna reveals the identity of the jñeya: the Supersoul, hṛdi sarvasya.", "focus": [["Purport (a)-(b): Why do we need sun and moon here but not in the spiritual world?", "In the material world the Lord's brahmajyoti is covered by mahat-tattva. In the spiritual kingdom His effulgence lights everything. So He is not in the material world but far beyond its darkness (ādityavarṇaṁ tamasaḥ parastāt)."], ["Purport (d): Even though He is in everyone’s heart, how is He different from the soul?", "There are two knowers. He has hands and legs everywhere while the jīva’s are localized. He is Prabhu, master of all living entities, and their shelter."]], "fc": [["jyotiṣām api taj jyotiḥ", "The light of all luminous objects."], ["tamasaḥ param", "Beyond darkness."], ["jñāna-gamya", "The goal of knowledge."]], "cz": ["He is the source of {{light}} in all luminous objects. He is beyond the {{darkness}} of matter and is {{unmanifested}}. He is knowledge, He is the object of knowledge, and He is the {{goal}} of knowledge. He is situated in everyone’s {{heart}}."], "ap": [["What does “He is knowledge, the object of knowledge and the goal of knowledge” imply for how you study?", "Study is not only information; it is a path toward Him. Example: I read Gītā verses to approach Him, not just collect facts."]], "ex": "He is the light behind every light, beyond material darkness, and He dwells in every heart as knowledge, its object and its goal.", "verse": "jyotiṣām api taj jyotis\ntamasaḥ param ucyate\njñānaṁ jñeyaṁ jñāna-gamyaṁ\nhṛdi sarvasya viṣṭhitam", "tr": "He is the source of light in all luminous objects. He is beyond the darkness of matter and is unmanifested. He is knowledge, He is the object of knowledge, and He is the goal of knowledge. He is situated in everyone’s heart.", "trlabel": "Translation (from your PDF)", "lt": ["He is the light in all luminous objects", "said to be beyond darkness", "knowledge, the object of knowledge, the goal of knowledge", "situated in the heart of everyone"]}, {"n": 19, "nl": "13.19", "label": "Text 13.19", "title": "Only devotees understand", "gist": "The science of kṣetra, kṣetrajña, jñāna and jñeya is most fully understood only by devotees (mad-bhakta).", "focus": [["Purport (a)-(b): What is vijñāna, and what do monists claim?", "Vijñāna is the science of knowledge: the knower, the knowable and the process of knowing. Monists say the three become one at the ultimate stage; devotees do not agree."], ["Purport (c)-(d): What is knowledge, and what did 13.13–13.18 explain?", "Knowledge is understanding oneself in Kṛṣṇa consciousness and realizing Krishna in everything, a preliminary stage of understanding devotional service. 13.13–13.18 explain the soul and Supersoul as the knowable, with the Supersoul the ultimate object."]], "fc": [["mad-bhakta", "My devotee."], ["mad-bhāva", "My nature."], ["vijñāna (per purport)", "The science of knowledge: the knower, the knowable and the process of knowing."]], "cz": ["Thus the {{field of activities}}, {{knowledge}}, and the {{knowable}} have been summarily described by Me. Only My {{devotees}} can understand this thoroughly and thus attain to My nature."], "ap": [["Why might devotion, rather than intellect alone, be the key to understanding here?", "The purport says knowledge is a preliminary stage to understanding devotional service. Example: intellect can analyze, but relationship gives realization."]], "ex": "Kṛṣṇa has summarized the field, knowledge and the knowable. Devotees can understand it fully and come to share His nature.", "verse": "iti kṣetraṁ tathā jñānaṁ\njñeyaṁ coktaṁ samāsataḥ\nmad-bhakta etad vijñāya\nmad-bhāvāyopapadyate", "tr": "Thus the field of activities [the body], knowledge, and the knowable have been summarily described by Me. Only My devotees can understand this thoroughly and thus attain to My nature.", "trlabel": "Translation (from your PDF)", "lt": ["Thus the field, and knowledge", "and the knowable have been described in summary", "My devotee, understanding this", "attains My nature"], "link": {"prev": "13.18", "t": "Krishna ends the explanation of the knowable by describing the qualification of the one able to understand these topics: only His devotees.", "src": "notes"}}], "why": ["Krishna answers Arjuna's sixth question: the soul can know the Supersoul, the ultimate object of knowledge. Only devotees can fully understand the field, the process of knowledge, and both soul and Supersoul.", "notes"], "from": {"prev": "Section 2", "t": "Section 2 gave the process of knowledge. Section 3 now gives its object (jñeya): what that knowledge is meant to reveal, first the soul (13.13) and then the Supersoul (13.14 to 13.18).", "src": "mine"}, "one": "The object of knowledge: the soul and the Supersoul; only devotees fully understand.", "nxt": "Now back to nature and the soul: how the entanglement arose."}, {"id": "S4", "num": 4, "range": "13.20 – 13.26", "title": "Prakṛti, puruṣa and their union", "gist": "Krishna addresses Arjuna's first and second questions. Prakṛti and puruṣa are beginningless. Matter causes all material changes and effects. The living entity meets good and bad according to the qualities acquired by association with matter. The Supersoul is the overseer, permitter and supreme proprietor. Understanding this brings liberation, and there are several paths (jñāna, aṣṭāṅga, karma, and hearing).", "app": "The conditioned soul's desire to control and enjoy matter binds him. The Supersoul is the factual enjoyer and controller. Understanding this leads toward liberation. Freedom from prakṛti comes from recognizing the true puruṣa.", "q": [["What are the main points of 13.20–13.22?", "Prakṛti and puruṣa (the jīva or kṣetrajña) and their union: material nature causes all material changes and effects, and the living entity meets good and bad according to the qualities acquired by association with matter."], ["What is 13.23’s addition, and what is the result of understanding?", "The Paramātmā puruṣa (kṣetrajña): the Supersoul exists within all bodies as overseer, permitter and supreme proprietor. Result: liberation from birth in the material world (13.24). Other methods: jñāna, aṣṭāṅga and karma (13.25–13.26)."], ["Practical application of Section IV?", "The conditioned soul’s desire to control and enjoy matter binds him. The Supersoul is the factual enjoyer and controller. Understanding this leads toward liberation. Freedom from prakṛti is available to one who recognizes the true puruṣa, because bondage is due to trying to take the Lord’s position."], ["Which paths reach this understanding?", "Jñāna-yoga, aṣṭāṅga-yoga, karma-yoga, and bhakti-yoga which begins with hearing."]], "fl": [], "texts": [{"n": 20, "nl": "13.20", "label": "Text 13.20", "title": "All good and bad events occur in matter", "gist": "Material nature and living entities are beginningless (their union is anādi). Transformations and the modes are products of nature.", "focus": [["Purport (b): How are nature and the living entity similar and different?", "Both are eternal. Nature is eternal but its manifestations are temporary and it constantly transforms; the living entity, the Lord's superior energy, does not change. Both are absorbed into Mahā-Viṣṇu at annihilation and manifested again."], ["Purport (c): Why does the eternal living entity fall into the material world?", "Due to his rebellious nature. It doesn’t really matter how we came in contact with matter; the Lord knows how and why."], ["Purport (a): Who are the two knowers and their categories?", "The embodied individual soul, called puruṣa, in the category of the Lord’s energy; and the Supersoul, in the category of the Lord’s personal expansion."]], "fc": [["anādī", "Beginningless."], ["vikāra", "Transformation."], ["guṇa", "Mode of material nature."], ["prakṛti-sambhava", "Born of nature."]], "cz": ["{{Material nature}} and the {{living entities}} should be understood to be beginningless. Their {{transformations}} and the {{modes}} of matter are products of material nature."], "ap": [["Why does it matter to know that you, the living entity, are not a product of nature?", "If I am not a product of nature, my identity is not tied to the body’s changes, so loss and change touch me less."]], "ex": "Both matter and the individual soul are eternal. All changes and the three modes come from matter. The soul is not made by nature.", "verse": "prakṛtiṁ puruṣaṁ caiva\nviddhy anādī ubhāv api\nvikārāṁś ca guṇāṁś caiva\nviddhi prakṛti-sambhavān", "tr": "Material nature and the living entities should be understood to be beginningless. Their transformations and the modes of matter are products of material nature.", "trlabel": "Translation (from your PDF)", "lt": ["Material nature and the living entity", "know both to be beginningless", "and the transformations and the modes", "know to be born of material nature"]}, {"n": 21, "nl": "13.21", "label": "Text 13.21", "title": "Happiness and distress from identification", "gist": "Happiness and distress arise from puruṣa's identifying with prakṛti. Nature causes material causes and effects; the living entity causes his sufferings and enjoyments through illusory oneness with matter.", "focus": [["Purport (a): What is the basis of the 8.4 million species, and why is the living entity in the material world?", "Different sensual pleasures and desires. He is here because of his desire to lord it over material nature; the spiritual world is free from it."], ["Purport (b): How is the body assigned, and what is the law once it is assigned?", "According to past desire and activity, which decide one’s residential quarters. Once a body is attained, one comes under nature’s laws and behaves as a dog, hog, demigod, etc."], ["Purport (c): Who accompanies the soul in all circumstances?", "The Supersoul (Muṇḍaka Upaniṣad)."]], "fc": [["kārya-kāraṇa-kartṛtve hetuḥ prakṛtiḥ", "Nature is the cause of material activities and effects."], ["sukha-duḥkha-bhoktṛtve puruṣaḥ", "The living entity is the cause of experiencing happiness and distress."]], "cz": ["{{Nature}} is said to be the cause of all material {{activities}} and {{effects}}, whereas the {{living entity}} is the cause of the various {{sufferings}} and {{enjoyments}} in this world."], "ap": [["Recall a situation in which you blamed circumstances for how you felt. What does this verse say about your part?", "The circumstances come from nature, but experiencing them as happiness or distress involves the living being’s own identification."]], "ex": "Nature produces bodies and events. The soul is responsible for the experience of enjoying and suffering because of identifying with the body.", "verse": "kārya-kāraṇa-kartṛtve\nhetuḥ prakṛtir ucyate\npuruṣaḥ sukha-duḥkhānāṁ\nbhoktṛtve hetur ucyate", "tr": "Nature is said to be the cause of all material activities and effects, whereas the living entity is the cause of the various sufferings and enjoyments in this world.", "trlabel": "Translation (from your PDF)", "lt": ["In producing material effects and causes", "nature is said to be the cause", "the living entity, of happiness and distress", "in experiencing them, is said to be the cause"]}, {"n": 22, "nl": "13.22", "label": "Text 13.22", "title": "Desire to enjoy forges the bond", "gist": "The desire to enjoy forges the bond between puruṣa and prakṛti. The living entity follows the ways of life according to the modes, and association leads to good and evil births.", "focus": [["Purport (a)-(c): How does transmigration work, and how does Krishna consciousness help?", "Like changing dress (Bg. 2.22), due to attachment to material existence. Desire to lord it over puts him in undesirable circumstances. Association with the three modes binds him to different bodies. Kṛṣṇa consciousness helps him rise above the modes."], ["Purport (d): How can this change be effected?", "By hearing from authoritative sources, like Arjuna hearing from Krishna. Submitting to hearing, he gradually loses his desire to dominate and enjoys spiritual happiness proportionately."]], "fc": [["prakṛti-stha", "Situated in material nature."], ["guṇa-saṅga", "Association with the modes."], ["sad-asad-yoni", "Good and evil wombs or species."]], "cz": ["The living entity in material nature thus follows the ways of life, {{enjoying}} the three modes of nature. This is due to his {{association}} with that material nature. Thus he meets with {{good and evil}} amongst various species."], "ap": [["Which of the three modes do you notice most strongly in your own choices this week?", "Open-ended. Example: rajas, restless activity for results; notice it and pause."]], "ex": "The soul in matter enjoys the modes of nature. Because of that association, he takes birth in higher or lower forms. Attachment to the modes is the cause.", "verse": "puruṣaḥ prakṛti-stho hi\nbhuṁkte prakṛti-jān guṇān\nkāraṇaṁ guṇa-saṁgo ’sya\nsad-asad-yoni-janmasu", "tr": "The living entity in material nature thus follows the ways of life, enjoying the three modes of nature. This is due to his association with that material nature. Thus he meets with good and evil amongst various species.", "trlabel": "Translation (from your PDF)", "lt": ["The living entity situated in material nature", "enjoys the modes born of nature", "association with the modes is the cause", "of his birth in good and evil species"]}, {"n": 23, "nl": "13.23", "label": "Text 13.23", "title": "The actual puruṣa: the Supersoul", "gist": "The second puruṣa: never entangled like the ordinary one. The transcendental enjoyer, supreme proprietor, overseer and permitter, known as Supersoul.", "focus": [["Purport (a): How does the purport refute the monists?", "The Lord says He is represented by Paramātmā in every body. He is “para” (transcendental), different from the individual soul; His name is Paramātmā, not ātmā. He is present as witness, overseer, permitter and supreme enjoyer, with hands and legs everywhere."], ["Purport (a): What is the difference between bhoktā and bhukta?", "Supersoul is bhoktā (maintainer); the individual soul is bhukta (maintained). The Supersoul also stays as a real friend, present to sanction the soul’s desires."], ["Purport (b)-(c): How is the living entity related to the Lord, and how does the Lord act as well-wisher?", "The living entity is eternally part and parcel, friends intimately, but marginal, with the tendency to reject the Lord’s sanction and misuse independence. The Lord stays with him, instructing from within and from without as the Gītā: “give it up and turn your faith to Me.” An intelligent person places faith in the Paramātmā."]], "fc": [["upadraṣṭā", "Overseer."], ["anumantā", "Permitter."], ["maheśvara", "Supreme proprietor."], ["paramātmā", "Supersoul."]], "cz": ["Yet in this body there is another, a {{transcendental}} enjoyer who is the Lord, the supreme {{proprietor}}, who exists as the {{overseer}} and {{permitter}}, and who is known as the {{Supersoul}}."], "ap": [["What does it mean that nothing happens without the Supersoul’s sanction, and how might that shape your sense of control?", "The individual may desire, but the Lord permits results. Example: I do my part but accept outcomes as ultimately sanctioned by Him."]], "ex": "Alongside me in the body is another: the Lord as Supersoul. He watches, permits, supports and enjoys everything, and is distinct from me.", "verse": "upadraṣṭānumantā ca\nbhartā bhoktā maheśvaraḥ\nparamātmeti cāpy ukto\ndehe ’smin puruṣaḥ paraḥ", "tr": "Yet in this body there is another, a transcendental enjoyer who is the Lord, the supreme proprietor, who exists as the overseer and permitter, and who is known as the Supersoul.", "trlabel": "Translation (from your PDF)", "lt": ["The overseer and permitter", "supporter, enjoyer, supreme proprietor", "is also called the Supersoul", "the transcendental person in this body"]}, {"n": 24, "nl": "13.24", "label": "Text 13.24", "title": "Knowledge leads to liberation", "gist": "Knowing the philosophy of 13.20–13.23 gives liberation: no more births in the material world.", "focus": [["Purport (a)-(c): What is the result and purpose of this knowledge, and how is it attained?", "Result: liberation and return to the spiritual world. Purpose: to understand how the living entity fell into a precarious material condition. Attained by personal endeavor with guru, sādhu and śāstra, and by understanding the Gītā as explained by the Lord."]], "fc": [["sarvathā vartamāno ’pi", "In whatever present position."], ["na bhūyo ’bhijāyate", "He is not born again."]], "cz": ["One who understands this philosophy concerning material {{nature}}, the living entity and the interaction of the {{modes}} is sure to attain {{liberation}}. He will not take {{birth}} here again, regardless of his present position."], "ap": [["The verse says “regardless of his present position.” Why is that encouraging?", "Liberation isn’t limited to a special class; whatever my situation, knowledge is available."]], "ex": "Understanding nature, the soul and how the modes interact frees one from rebirth in this world, no matter what position he now occupies.", "verse": "ya evaṁ vetti puruṣaṁ\nprakṛtiṁ ca guṇaiḥ saha\nsarvathā vartamāno ’pi\nna sa bhūyo ’bhijāyate", "tr": "One who understands this philosophy concerning material nature, the living entity and the interaction of the modes of nature is sure to attain liberation. He will not take birth here again, regardless of his present position.", "trlabel": "Translation (from your PDF)", "lt": ["One who thus understands the living entity", "and material nature, together with the modes", "in whatever situation he may be", "he is not born again"]}, {"n": 25, "nl": "13.25", "label": "Text 13.25", "title": "Various yogas to understand this", "gist": "One can achieve the understanding of 13.20–13.23 by various yogas: meditation (dhyāna), cultivation of knowledge (sāṅkhya) and karma-yoga.", "focus": [["Purport (a)-(b): Which two classes of conditioned souls does the Lord explain?", "Faithful in spiritual life (introspective devotees, philosophers, and workers who renounced fruits) and atheists, agnostics and skeptics, who are beyond spiritual understanding, including those who establish monism. Devotees are best situated because they know the spiritual world and the Supreme Personality of Godhead who expands as Paramātmā."], ["Purport (c): How does the sāṅkhya count elements?", "Twenty-four material elements; the soul as the twenty-fifth; the Supersoul as the twenty-sixth. Finally one comes to devotional service in Kṛṣṇa consciousness."]], "fc": [["dhyāna", "Meditation."], ["sāṅkhya", "Cultivation of knowledge, analytical study."], ["karma-yoga", "Working without fruitive desire."]], "cz": ["That Supersoul is perceived by some through {{meditation}}, by some through the cultivation of {{knowledge}}, and by others through working without {{fruitive desire}}."], "ap": [["Which of these three paths fits your temperament right now, and what is one small step in it?", "Open-ended. Example: karma-yoga, doing my daily work with attention to duty, not results."]], "ex": "Different people see the Supersoul in different ways: through meditation, through study of knowledge, or through selfless work.", "verse": "dhyānenātmani paśyanti\nkecid ātmānam ātmanā\nanye sāṁkhyena yogena\nkarma-yogena cāpare", "tr": "That Supersoul is perceived by some through meditation, by some through the cultivation of knowledge, and by others through working without fruitive desire.", "trlabel": "Translation (from your PDF)", "lt": ["By meditation some perceive within", "the Supersoul, with the mind", "others by cultivation of knowledge", "and others by working without fruitive desire"]}, {"n": 26, "nl": "13.26", "label": "Text 13.26", "title": "Bhakti through hearing is easiest", "gist": "Bhakti is the easiest and best path. Those who don’t know spiritual knowledge but worship upon hearing from others also cross birth and death. Hearing with faith from authorities has great potency.", "focus": [["Purport (a)-(b): Why does the verse especially apply to modern society, and who is qualified?", "Because there is practically no spiritual education today. Any common man who is a good soul has a chance of advancing by hearing."], ["Purport (c)-(e): What does Lord Caitanya stress, and what is the conclusive advice?", "Hearing from authority, especially the Hare Kṛṣṇa mahā-mantra; there is no need to change position (SB 10.14.3) but give up speculative reasoning and become a servant of those who know the Lord. Take shelter of a pure devotee, hear from him and follow in his footsteps."]], "fc": [["śruti-parāyaṇa", "Devoted to hearing from authorities."], ["mṛtyum atitaranti", "They cross beyond death."]], "cz": ["... begin to {{worship}} the Supreme Person upon {{hearing}} about Him from others. Because of their tendency to hear from {{authorities}}, they also transcend the path of {{birth and death}}."], "ap": [["Who do you listen to regularly for spiritual guidance, and how do you know they are an authority?", "Open-ended. Example: a teacher or text with a lineage whose life matches the teachings."]], "ex": "Even someone without much knowledge can progress by humbly hearing about the Lord from real authorities. That hearing leads across birth and death.", "verse": "anye tv evam ajānantaḥ\nśrutvānyebhya upāsate\nte ’pi cātitaranty eva\nmṛtyuṁ śruti-parāyaṇāḥ", "tr": "Again there are those who, although not conversant in spiritual knowledge, begin to worship the Supreme Person upon hearing about Him from others. Because of their tendency to hear from authorities, they also transcend the path of birth and death.", "trlabel": "Translation (from your PDF)", "lt": ["Others, not knowing this", "hear from others and worship", "they also cross beyond", "death, being devoted to hearing"]}], "why": ["Krishna answers Arjuna's first and second questions. Prakṛti and puruṣa are beginningless; matter causes all material changes; the living entity meets good and bad through association with matter; the Supersoul is overseer and permitter; understanding this brings liberation, and there are several paths to it.", "notes"], "from": {"prev": "Section 3", "t": "Having shown the Supersoul as the object of knowledge, Krishna returns to prakṛti and puruṣa (questions 1 and 2) to show how the soul became entangled and how the Supersoul stands beside him.", "src": "mine"}, "one": "Prakṛti and puruṣa, the Supersoul as overseer, and the paths to liberation.", "nxt": "So what does one see who knows all this?"}, {"id": "S5", "num": 5, "range": "13.27 – 13.35", "title": "Jñāna-cakṣu: the vision of knowledge", "gist": "Those who see the distinction between the body, its owner and the Supersoul, and who know the process of liberation, attain the Supreme goal (13.35).", "app": "One who sees the Supersoul, the living entities and material nature in their proper perspective sees through the eyes of knowledge.", "q": [["What is Section V about, and what is the link from Section IV?", "Jñāna-cakṣu, the vision of knowledge. Having described prakṛti, puruṣa, kṣetra, kṣetrajña, jñāna and jñeya, the Lord now describes the vision of one who understands them in proper perspective."], ["Summarized theme 13C: List the six things the man of knowledge sees (A–F).", "A: distinguishes spirit and matter in all circumstances (13.27). B: sees the indestructible Supersoul with the indestructible soul in all bodies (13.28). C: sees the Supersoul equally everywhere (13.29). D: sees that all activities are done by the body, the self does nothing (13.30). E: sees the living entity as distinct from the field (13.31). F: sees that the soul never mixes with the body, and is transcendental and eternal (13.32)."], ["Practical application of 13.29–13.31.", "Be neither disturbed nor envious. Act properly and see the Supersoul, the ultimate sanctioning agent, in all beings. The soul does nothing, for humility. Stop seeing people as their fields of activity; the soul and Supersoul have nothing to do with matter."]], "fl": [], "texts": [{"n": 27, "nl": "13.27", "label": "Text 13.27", "title": "Distinguishing spirit and matter in all circumstances", "gist": "A realized person distinguishes spirit and matter everywhere: all moving and nonmoving things are a combination of the field and the knower of the field. The Supreme Lord effects the combination.", "focus": [["Purport: Who effects the combination of superior and inferior energies?", "The Supreme Lord, controller of both the superior (living entity) and inferior (matter) energies."]], "fc": [["sthāvara-jaṅgama", "Nonmoving and moving."], ["kṣetra-kṣetrajña-saṁyoga", "The combination of field and knower."]], "cz": ["Whatever you see in existence, both {{moving}} and {{unmoving}}, is only the {{combination}} of the {{field of activities}} and the {{knower of the field}}."], "ap": [["Look at a tree or an animal. What is the field and what is the knower?", "Field: the material body. Knower: the living entity within, giving it life."]], "ex": "All things, moving or still, are matter joined with a living being. The Lord arranges that combination.", "verse": "yāvat sañjāyate kiñcit\nsattvaṁ sthāvara-jaṁgamam\nkṣetra-kṣetrajña-saṁyogāt\ntad viddhi bharatarṣabha", "tr": "O chief of the Bhāratas, whatever you see in existence, both moving and unmoving, is only the combination of the field of activities and the knower of the field.", "trlabel": "Translation (from your PDF)", "lt": ["Whatever comes into being", "moving or nonmoving, any existence", "is from the combination of the field and its knower", "know that, O best of the Bhāratas"]}, {"n": 28, "nl": "13.28", "label": "Text 13.28", "title": "The actual seer", "gist": "The one who sees the indestructible Supersoul always accompanying the indestructible individual soul in all bodies is the actual seer.", "focus": [["Purport (a)-(c): What three things does he see, how, and what are the two meanings of parameśvara?", "The body, its proprietor and the Supersoul as the soul’s friend, in proper perspective. Possible through good association with a real knower of spiritual subjects. Parameśvara may mean the individual soul (master of the body, unaffected by its destruction) or the Supersoul.
